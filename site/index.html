<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>catalog.cafe</title>
<meta name="description" content="Plan your coffee setup: browse espresso machines, grinders, brewers, kettles, scales and beans, and let the setup assistant suggest a kit that fits your budget.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Layout: a scrolling browsing pane of product sections on the left and the setup assistant on the right.
   Each section shows a few rows of small thumbnails; a section opens a category page with filter pills. */
/* Tokens mirror the catalog.cafe design system. Primitives first, then semantic roles. Components use semantic tokens only. */
:root{
  --grey-0:#ffffff; --grey-25:#fafafa; --grey-50:#f5f5f5; --grey-100:#f0f0f0; --grey-150:#e8e8e8; --grey-200:#e2e2e2; --grey-400:#a0a0a0; --grey-500:#6b6b6b;
  --grey-700:#323232; --grey-750:#2f2f2f; --grey-800:#262626; --grey-825:#212121; --grey-850:#1c1c1c; --grey-900:#111111; --bronze-300:#e0a45a; --bronze-600:#96601c; --blue-300:#6ea6f7; --blue-600:#0951b9;

  --text-primary:var(--grey-900); --text-secondary:var(--grey-500); --text-on-action:var(--grey-0); --text-on-accent:var(--grey-0); --icon-inactive:var(--grey-400);
  --surface-page:var(--grey-50); --surface-raised:var(--grey-0); --surface-control:var(--grey-100); --surface-control-hover:var(--grey-150); --surface-hover-subtle:var(--grey-25); --surface-sunken:var(--grey-200);
  --border-subtle:var(--grey-200); --action-primary:var(--grey-900); --accent:var(--bronze-600); --text-highlight:var(--blue-600); --overlay-scrim:rgba(17,17,17,.32);
  --shadow-raised:0 12px 48px rgba(17,17,17,.10); --shadow-control:0 1px 4px rgba(17,17,17,.10);

  --gap-tight:4px; --gap-stack:8px; --gap-controls:12px; --inset-control:16px; --inset-surface:24px; --inset-surface-lg:36px; --gutter-page:24px; --gutter-page-compact:16px;
  --radius-control:999px; --radius-option:14px; --radius-surface:22px;
  --radius-section:16px; --radius-thumb:12px; --size-thumb:60px; --gap-thumb:8px; --gutter-page-wide:32px; --width-sidebar:400px; --height-header:72px; --height-footer:44px; --gap-section:24px;
  --font-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --text-primary:var(--grey-50); --text-secondary:var(--grey-400); --text-on-action:var(--grey-900); --text-on-accent:var(--grey-900); --icon-inactive:var(--grey-500);
  --surface-page:var(--grey-900); --surface-raised:var(--grey-850); --surface-control:var(--grey-800); --surface-control-hover:var(--grey-750); --surface-hover-subtle:var(--grey-825); --surface-sunken:var(--grey-700);
  --border-subtle:var(--grey-700); --action-primary:var(--grey-50); --accent:var(--bronze-300); --text-highlight:var(--blue-300); --overlay-scrim:rgba(0,0,0,.55);
  --shadow-raised:0 12px 48px rgba(0,0,0,.45); --shadow-control:0 1px 4px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-weight:400;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
/* ---------- layout: browsing pane on the left, setup assistant on the right ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--width-sidebar);background:var(--surface-raised)}
.app.closed{grid-template-columns:minmax(0,1fr) 0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.hdr{flex:none;display:flex;align-items:center;gap:var(--gap-stack);height:calc(var(--height-header) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(var(--gutter-page-wide),env(safe-area-inset-right,0px)) 0 max(var(--gutter-page-wide),env(safe-area-inset-left,0px))}
.logo{margin-right:auto;text-decoration:none;color:var(--text-primary);font-size:17px;letter-spacing:-.03em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn{border:0;background:var(--surface-control);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-primary)}
@media (hover:hover){.icon-btn:hover{background:var(--surface-control-hover)}}
.icon-btn.flat{background:none;color:var(--text-secondary)}
.cta{border:0;background:var(--action-primary);color:var(--text-on-action);height:40px;padding:0 18px;border-radius:var(--radius-control);font-size:14px}
.app:not(.closed) #openSide{display:none}
.cta.outline{background:none;color:var(--text-primary);border:1px solid var(--border-subtle)}
@media (hover:hover){.cta.outline:hover{background:var(--surface-hover-subtle)}}
.search{position:relative;display:flex;align-items:center}
.search input{width:0;opacity:0;visibility:hidden;border:0;border-bottom:1px solid var(--border-subtle);background:none;font:inherit;font-size:15px;color:var(--text-primary);padding:8px 0;outline:none;transition:width .25s ease,opacity .2s,visibility .25s}
.search input::placeholder{color:var(--text-secondary)}
.search.open input{width:min(320px,45vw);opacity:1;visibility:visible}
.search-btn{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-primary)}
.sdrop{position:absolute;top:calc(100% + 8px);right:0;z-index:12;width:min(400px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:var(--surface-raised);border-radius:var(--radius-option);box-shadow:var(--shadow-raised),0 0 0 1px var(--border-subtle) inset;padding:var(--gap-tight) var(--inset-control)}
.sdrop .setrow{cursor:pointer}
.sdrop .ms{text-align:left;margin:12px 0}
.review{border:0;background:var(--accent);color:var(--text-on-accent);height:36px;padding:0 14px;border-radius:var(--radius-control);font-size:13px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 max(var(--gutter-page-compact),env(safe-area-inset-right,0px)) var(--inset-surface) max(var(--gutter-page-compact),env(safe-area-inset-left,0px))}

/* home: one section per product type, a few rows of small thumbnails */
.sec+.sec{margin-top:var(--gap-section)}
.sec{display:block;padding:var(--inset-control);border-radius:var(--radius-section);cursor:pointer;transition:background .15s}
@media (hover:hover){.sec:hover{background:var(--surface-hover-subtle)}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);min-height:24px;margin-bottom:var(--gap-controls)}
.sec-t{margin:0;font-size:17px;font-weight:400}
.sec-l{display:flex;align-items:center;flex-wrap:wrap;gap:var(--gap-stack);min-width:0}
.sec-arrow{width:18px;height:18px;opacity:0;transform:translateX(-6px);transition:opacity .2s ease,transform .45s cubic-bezier(.34,1.56,.64,1),color .25s ease}
/* title hover: letters step up to Medium and turn blue one after another, while the title slings a few pixels right */
.sec-t a{display:inline-block;color:inherit;text-decoration:none;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.sec-t .ch{transition:font-weight .18s ease,color .25s ease;transition-delay:calc(var(--i) * 22ms)}
@media (hover:hover){
  .sec:hover .sec-t a{transform:translateX(4px)}
  .sec:hover .sec-t .ch{font-weight:500;color:var(--text-highlight)}
  .sec:hover .sec-arrow{color:var(--text-highlight);transform:translateX(4px)}
}
.sec:focus-within .sec-t .ch{font-weight:500;color:var(--text-highlight)}
.sec:hover .sec-arrow,.sec:focus-within .sec-arrow{opacity:1;transform:none}
@media (hover:none){.sec-arrow{opacity:1;transform:none}}
.sec-pills{display:flex;flex-wrap:wrap;gap:var(--gap-stack);margin-left:var(--gap-tight)}
.sec-pills .chip{height:26px}
.thumbs{display:grid;grid-template-columns:repeat(var(--cols,8),var(--size-thumb));gap:var(--gap-thumb)}
.tb{width:var(--size-thumb);height:var(--size-thumb);border:0;background:none;padding:5px;border-radius:var(--radius-thumb);display:block}
.tb>svg,.tb>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
@media (hover:hover){.tb:hover{background:var(--surface-raised)}}
.more{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.3;padding:0}
.more span{font-size:11px;color:var(--text-secondary)}
.sec .ms{text-align:left;margin:0}

/* category page */
.cat-h{padding:var(--gap-stack) var(--inset-control) var(--inset-surface)}
.backl{color:var(--text-secondary);font-size:13px;text-decoration:none}
.cat-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--gap-controls) 20px;margin-top:var(--gap-controls)}
.cat-t{margin:0;font-size:36px;font-weight:300;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
.chip{border:1px solid var(--border-subtle);background:none;border-radius:var(--radius-control);height:30px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:var(--gap-tight);color:var(--text-primary)}
.chip[aria-pressed="true"]{background:var(--action-primary);border-color:var(--action-primary);color:var(--text-on-action);padding-right:8px}
.chip .ic{width:14px;height:14px}
.count{color:var(--text-secondary);font-size:13px;margin:var(--gap-controls) 0 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--inset-surface) var(--gap-controls);padding:0 var(--inset-control)}
.p{border:0;background:none;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--gap-stack);min-width:0;text-align:center}
.p .img{display:block;width:100%;aspect-ratio:1;padding:10%;transition:transform .2s ease}
.p .img>svg,.p .img>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
.p .nm{font-size:13px;line-height:1.3;text-wrap:balance}
@media (hover:hover){.p:hover .img{transform:translateY(-3px)}}
.empty{grid-column:1/-1;color:var(--text-secondary);padding:8vh 0;text-align:center}

/* footer, pinned under the scrolling pane */
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);flex-wrap:wrap;min-height:var(--height-footer);
  padding:0 max(var(--gutter-page-wide),env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(var(--gutter-page-wide),env(safe-area-inset-left,0px));font-size:11px;color:var(--text-secondary)}
.foot nav{display:flex;gap:20px}
.foot button,.foot a{border:0;background:none;padding:0;font-size:inherit;color:inherit;text-decoration:none}
@media (hover:hover){.foot button:hover,.foot a:hover{color:var(--text-primary)}}

/* setup assistant */
.side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--surface-raised);border-left:1px solid var(--border-subtle)}
.app.closed .side{visibility:hidden;border:0}
.side-h{flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--inset-control) 0 var(--inset-surface)}
.side-h h2{margin:0;font-size:15px;font-weight:400}
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--gap-stack) var(--inset-surface) var(--inset-control);display:flex;flex-direction:column;gap:var(--gap-controls)}
.qlab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);margin:0}
.qh{margin:0;font-size:24px;font-weight:300;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.qs{margin:-6px 0 0;font-size:14px;color:var(--text-secondary)}
.qsmall{margin:var(--gap-stack) 0 0;font-size:15px}
.qsmall span{color:var(--text-secondary)}
.past{margin:0;font-size:14px;color:var(--text-secondary)}
.me{align-self:flex-end;max-width:85%;border:0;background:var(--surface-control);border-radius:16px;padding:9px 14px;font-size:14px;text-align:left}
button.me{cursor:pointer}
.bot{margin:0;font-size:15px}
.ans{display:flex;flex-direction:column;gap:var(--gap-stack);margin:0 calc(var(--gap-stack) * -1)}
.ans button{border:0;background:var(--surface-control);border-radius:var(--radius-thumb);min-height:48px;padding:12px var(--inset-control);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);font-size:15px;color:var(--text-primary)}
.ans button small{display:block;font-size:12px;color:var(--text-secondary);margin-top:2px}
@media (hover:hover){.ans button:hover{background:var(--surface-control-hover)}}
.ans .go{background:var(--action-primary);color:var(--text-on-action);margin-top:var(--gap-stack)}
@media (hover:hover){.ans .go:hover{background:var(--action-primary)}}
.ans .go[disabled]{opacity:.35;cursor:default}
.box{width:18px;height:18px;border-radius:5px;border:1.25px solid var(--text-secondary);display:grid;place-items:center;flex:none}
.box .ic{width:14px;height:14px;stroke-width:2.25;visibility:hidden}
[aria-pressed="true"] .box{background:var(--action-primary);border-color:var(--action-primary);color:var(--text-on-action)}
[aria-pressed="true"] .box .ic{visibility:visible}
.tune{border:1px solid var(--border-subtle);border-radius:var(--radius-option);padding:var(--inset-control);display:flex;flex-direction:column;gap:var(--gap-stack)}
.tune .ans{margin:var(--gap-tight) calc(var(--gap-stack) * -1) 0}
.tune .hint{font-size:12px;color:var(--text-secondary);margin:0}
.kit{border:1px solid var(--border-subtle);border-radius:var(--radius-option);padding:var(--gap-tight) 0}
.kit-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--gap-controls);align-items:center;width:100%;border:0;background:none;padding:6px 12px;text-align:left;color:var(--text-primary)}
.kit-row .th{width:40px;height:40px}
.kit-row .th>svg,.kit-row .th>img{width:100%;height:100%;object-fit:contain;display:block}
.kit-row b{display:block;font-size:14px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit-row small{display:block;font-size:12px;color:var(--text-secondary)}
.kit-row .pz{font-size:14px;font-variant-numeric:tabular-nums}
.kit-tot{display:flex;justify-content:space-between;margin:var(--gap-tight) 12px 0;padding:10px 0 6px;border-top:1px solid var(--border-subtle);font-size:14px}
.row-acts{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
.soft{border:0;background:var(--surface-control);border-radius:var(--radius-control);height:36px;padding:0 14px;font-size:14px;color:var(--text-primary)}
.soft.dark{background:var(--action-primary);color:var(--text-on-action)}
.side-f{flex:none;display:flex;flex-direction:column;gap:var(--gap-stack);padding:var(--gap-stack) var(--inset-control) calc(var(--inset-control) + env(safe-area-inset-bottom,0px))}
.sugg{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
.chat{display:flex;align-items:center;gap:var(--gap-stack);height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-control);padding:0 var(--gap-stack) 0 20px}
.chat input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--text-primary);outline:none}
.chat input::placeholder{color:var(--text-secondary)}
.send{border:0;width:36px;height:36px;border-radius:50%;background:var(--action-primary);color:var(--text-on-action);display:grid;place-items:center}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay-scrim);z-index:20;display:flex;align-items:center;justify-content:center;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface-raised);width:100%;max-width:520px;max-height:86vh;overflow-y:auto;border-radius:var(--radius-surface);padding:12px 24px 24px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:980px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{display:none}
.mhead{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:1}
.x{border:0;background:var(--surface-control);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.hero{width:min(64%,280px);aspect-ratio:1;margin:-8px auto 6px}
.hero>svg,.hero>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.mt{text-align:center;font-size:24px;font-weight:300;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ms{text-align:center;color:var(--text-secondary);font-size:14px;margin:4px 0 0}
.price{text-align:center;font-variant-numeric:tabular-nums;font-family:var(--font-sans);font-size:15px;margin:10px 0 16px}
.note{font-size:15px;margin:0 0 16px}

dl.specs dt{color:var(--text-secondary);padding-right:16px}
dl.specs dd{text-align:right}
.range{margin:-6px 0 18px}
.range .lab{display:flex;justify-content:space-between;font-family:var(--font-sans);font-size:10.5px;color:var(--text-secondary);margin-top:6px}
.range .tr{height:8px;border-radius:4px;background:var(--surface-sunken);position:relative}
.range .tr i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.buy{display:flex;flex-direction:column;gap:8px}
.buy a,.buy button{display:flex;justify-content:space-between;align-items:center;text-decoration:none;border-radius:var(--radius-option);padding:14px 16px;font-weight:400;border:0}
.buy .pri{background:var(--action-primary);color:var(--text-on-action)}
.buy .sec{background:var(--surface-control);color:var(--text-primary)}
.buy small{font-weight:400;opacity:.7}
.disc{font-size:12px;color:var(--text-secondary);text-align:center;margin:12px 0 0}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.setrow .th{width:56px;height:56px}
.setrow .th>svg,.setrow .th>img{width:100%;height:100%;object-fit:contain}
.setrow button.rm{border:0;background:none;color:var(--text-secondary);font-size:13px}
.setrow .nm2{font-weight:400}
.setrow .pp{font-family:var(--font-sans);font-size:13px;color:var(--text-secondary)}
.tot{display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:400}
.tot span{font-family:var(--font-sans)}
.toast{position:fixed;left:50%;bottom:calc(50% - 20px);transform:translateX(-50%);background:var(--action-primary);color:var(--text-on-action);padding:10px 18px;border-radius:var(--radius-control);font-size:14px;z-index:30;animation:fade .2s}

/* browse all */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px 16px;margin-top:20px}

.bitem .bimg>svg,.bitem .bimg>img{width:100%;height:100%;object-fit:contain;overflow:visible}

.seg button{border:1px solid var(--border-subtle);background:none;border-radius:var(--radius-control);padding:6px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--action-primary);color:var(--text-on-action);border-color:var(--text-primary)}
/* search */
.sinput{width:100%;font:inherit;font-size:18px;border:0;border-bottom:1px solid var(--border-subtle);background:none;color:var(--text-primary);padding:10px 2px;outline:none}
.sres{margin-top:8px}
.sres .setrow{cursor:pointer}
.slabel{font-family:var(--font-sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
/* menu */
.mlist{display:flex;flex-direction:column;margin-top:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--border-subtle);background:none;text-align:left;font-size:16px;width:100%}
.mrow span{color:var(--text-secondary);font-size:14px}
.mrow select{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-control);border:0;border-radius:var(--radius-control);padding:6px 10px}
/* review */
.prop{border-bottom:1px solid var(--border-subtle);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.prop .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;position:static;padding:0;pointer-events:auto}
.prop .kind{font-family:var(--font-sans);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.prop .what{font-weight:400}
.prop .why{font-size:14px;color:var(--text-secondary)}
.prop .diff{font-family:var(--font-sans);font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.prop .diff s{color:var(--text-secondary)}
.prop .src{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.prop .src a{color:var(--text-secondary)}
.prop .acts{display:flex;gap:8px;margin-top:4px}
.prop .acts button{border:0;border-radius:10px;padding:8px 14px;font-weight:400;font-size:14px}
.prop .ok{background:var(--action-primary);color:var(--text-on-action)}
.prop .no{background:var(--surface-control)}
.allbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.pill{border:0;background:var(--surface-control);border-radius:var(--radius-control);height:40px;padding:0 16px;font-weight:400}

/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--gutter-page-wide:var(--gutter-page-compact)}
  .app,.app.closed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:15;border:0}
  .app.closed .side{display:none}
  .cat-t{font-size:28px}
  .foot{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .modal{max-width:none;border-radius:var(--radius-surface) var(--radius-surface) 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end;padding:0}
  .grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--surface-sunken);margin:0 auto 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
b,strong{font-weight:400}
.opt b{color:var(--text-primary)}
.note strong{color:var(--text-primary)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="pane">
    <header class="hdr">
      <a class="logo" href="#" aria-label="catalog.cafe home">catalog.cafe</a>
      <button class="review" id="reviewBtn" hidden></button>
      <div class="search" id="search"><input id="searchIn" type="search" placeholder="Search machines, grinders, beans…" aria-label="Search products" autocomplete="off"><button class="search-btn" id="searchBtn" aria-label="Search" aria-expanded="false"></button><div class="sdrop" id="sdrop" hidden></div></div>
      <button class="cta" id="openSide">Create setup</button>
    </header>
    <main class="main" id="main" aria-live="polite"></main>
    <footer class="foot">
      <nav><button id="aboutBtn">About and affiliate disclosure</button><button id="signBtn">Sign in</button></nav>
      <span>Bean data from <a href="https://www.loffeelabs.com/" target="_blank" rel="noopener">Loffee Labs</a>’ Bean Base</span>
    </footer>
  </div>
  <aside class="side" id="side" aria-label="Create setup">
    <div class="side-h"><h2>Create setup</h2><button class="cta outline" id="closeSide">Close</button></div>
    <div class="thread" id="thread"></div>
    <div class="side-f">
      <div class="sugg" id="sugg"></div>
      <form class="chat" id="chat"><input id="chatIn" type="text" placeholder="Ask anything, or tell me what you need…" aria-label="Ask the setup assistant" autocomplete="off"><button class="send" aria-label="Send"></button></form>
    </div>
  </aside>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* ---------- affiliate config: replace with your real tags ---------- */
const AFFILIATE={amazonTag:'YOURTAG-20'};

/* ---------- catalog: live from the artifact database (prices stored in USD) ---------- */
let GEAR=[];            // merged view of gear + beans, active items only
let RAW={gear:[],beans:[]};
let FX={USD:1};
let LOAD='loading';     // loading | ready | offline | stale
let PENDING=[];         // proposals awaiting review (editors only)
let isEditor=false, SB=null, SESSION=null;

const ICON={
  grinders:'<path d="M9 10h6v10H9z"/><path d="M8 10h8"/><path d="M12 10V4h6"/><circle cx="18.5" cy="4" r="1.5"/>',
  espresso:'<rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9 9h6"/><path d="M10 16v2.5h4V16"/><path d="M3 20.5h18"/>',
  brewers:'<path d="M4.5 6h15l-5 9h-5z"/><path d="M7 19.5h10"/><path d="M12 15v4.5"/>',
  kettles:'<path d="M7 20v-7a5 5 0 0 1 10 0v7z"/><path d="M7 15c-3 0-3.5-5-5-7"/><path d="M17 12h1.5a2 2 0 0 1 0 4H17"/><path d="M12 8V6.5"/>',
  scales:'<path d="M3 14h18l1.5 5h-21z"/><path d="M10 16.5h4"/>',
  beans:'<ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(30 12 12)"/><path d="M8.5 5.5c3 3 .5 9 6.5 13"/>'
};
const CURS={USD:'US dollar',CAD:'Canadian dollar',EUR:'Euro',GBP:'British pound',AUD:'Australian dollar'};
const cur=()=>FX[S.cur]?S.cur:'USD';
function money(usd){
  const c=cur(), v=usd*(FX[c]||1);
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}catch(e){return '$'+Math.round(v)}
}
function nice(usd){const v=usd*(FX[cur()]||1), st=v>=100?10:5;return Math.round(v/st)*st/(FX[cur()]||1)}
const under=n=>()=>`Under ${money(nice(n))}`, span=(a,b)=>()=>`${money(nice(a))}–${money(nice(b))}`, over=n=>()=>`${money(nice(n))}+`;
const B=(lo,hi)=>g=>g.price>=lo&&g.price<hi;
/* ---------- icons (rounded outline, 24 px grid) ---------- */
const ICONS={
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/>',
  x:'<path d="M7 7l10 10M17 7 7 17"/>',
  send:'<path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"/>',
  right:'<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>',
  sideClose:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15"/><path d="m8 9.5 2.5 2.5L8 14.5"/>',
  check:'<path d="m6 12.5 4 4 8-9"/>'
};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

/* ---------- product types and their filters ----------
   Filters inside a group are alternatives (Hand or Electric); groups combine (Electric and Espresso). */
const CATS=[
 {key:'espresso',label:'Espresso machines',short:'machines',cats:['espresso'],groups:[
   [['lever','Lever',g=>g.effort===3],['semi','Semi-automatic',g=>g.effort===2],['guided','Guided',g=>g.effort===1]],
   [['milk','Steam wand',g=>!!g.milk]],[['grinder','Built-in grinder',g=>!!g.builtIn]],[['compact','Compact',g=>g.w===1]]]},
 {key:'grinders',label:'Grinders',short:'grinders',cats:['grinder'],groups:[
   [['hand','Hand',g=>g.kind==='hand'],['electric','Electric',g=>g.kind!=='hand']],
   [['espresso','Espresso',g=>(g.does||[]).includes('espresso')],['filter','Filter',g=>(g.does||[]).includes('filter')]],
   [['single','Single dose',g=>g.kind!=='hand'&&g.kind!=='hopper'],['hopper','Hopper',g=>g.kind==='hopper']]]},
 {key:'brewers',label:'Brewers',short:'brewers',cats:['brewer'],groups:[
   [['pourover','Pour-over',g=>['cone','chemex'].includes(g.kind)],['immersion','Immersion',g=>['steep','aeropress'].includes(g.kind)],
    ['press','French press',g=>g.kind==='press'],['moka','Moka pot',g=>g.kind==='moka'],['machine','Drip machine',g=>!['cone','chemex','steep','aeropress','press','moka'].includes(g.kind)]]]},
 {key:'kettles',label:'Kettles and scales',short:'kettles and scales',cats:['kettle','scale'],groups:[
   [['kettle','Kettles',g=>g.cat==='kettle'],['scale','Scales',g=>g.cat==='scale']],
   [['electric','Electric',g=>g.cat==='kettle'&&!!g.electric],['stove','Stovetop',g=>g.cat==='kettle'&&!g.electric]],
   [['timer','With timer',g=>g.cat==='scale'&&!!g.timer]]]},
 {key:'beans',label:'Beans',short:'beans',cats:['bean'],groups:[
   [['light','Light roast',g=>g.roast==='light'],['medium','Medium roast',g=>g.roast==='medium'],['dark','Dark roast',g=>g.roast==='dark']],
   [['forEsp','For espresso',g=>g.for!=='filter'],['forFil','For filter',g=>g.for!=='espresso']],
   [['fruity','Fruity',g=>g.flavor==='fruity'],['choc','Chocolatey',g=>g.flavor==='choc'],['sweet','Sweet',g=>g.flavor==='sweet']]]}
];
const catOf=it=>CATS.find(c=>c.cats.includes(it.cat))||CATS[0];

/* ---------- state ---------- */
let S={view:'home',filters:{},setup:[],cur:'USD',side:true,chat:{}};
try{const old=JSON.parse(localStorage.getItem('bf2')||'null');if(old){S.setup=old.setup||[];S.cur=old.cur||'USD'}}catch(e){}
try{const s=JSON.parse(localStorage.getItem('cc3')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('cc3',JSON.stringify(S))}catch(e){}};
const byId=id=>GEAR.find(g=>g.id===id);
const phoneMQ=matchMedia('(max-width:760px)');
let LOG=[];   // free-text exchanges with the assistant, this visit only

/* ---------- product renders (procedural SVG, transparent background) ---------- */
let uid=0;
function shade(hex,p){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return `rgb(${r},${g},${b})`}
function art(it){
  const u='g'+(uid++), c=it.col||'#8A8D90', a=it.acc||'#333333';
  const isGlass=c==='glass'||c==='tan';
  const base=c==='chrome'?'#C9CCCF':isGlass?'#BFC9CE':c;
  const defs=`<defs>
   <linearGradient id="${u}b" x1="0" x2="1"><stop offset="0" stop-color="${shade(base,.28)}"/><stop offset=".42" stop-color="${base}"/><stop offset="1" stop-color="${shade(base,-.38)}"/></linearGradient>
   <linearGradient id="${u}m" x1="0" x2="1"><stop offset="0" stop-color="#E8E9EA"/><stop offset=".45" stop-color="#B4B7BA"/><stop offset="1" stop-color="#6E7276"/></linearGradient>
   <linearGradient id="${u}d" x1="0" x2="1"><stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#141414"/></linearGradient>
   <linearGradient id="${u}a" x1="0" x2="1"><stop offset="0" stop-color="${shade(a,.25)}"/><stop offset="1" stop-color="${shade(a,-.3)}"/></linearGradient>
   <linearGradient id="${u}g" x1="0" x2="1"><stop offset="0" stop-color="${c==='tan'?'rgba(210,175,120,.55)':'rgba(220,232,238,.55)'}"/><stop offset=".5" stop-color="${c==='tan'?'rgba(190,150,95,.35)':'rgba(190,205,212,.28)'}"/><stop offset="1" stop-color="${c==='tan'?'rgba(150,110,60,.6)':'rgba(140,160,170,.5)'}"/></linearGradient>
  </defs>`;
  const body=`url(#${u}b)`, metal=`url(#${u}m)`, dark=`url(#${u}d)`, acc=`url(#${u}a)`, glass=`url(#${u}g)`;
  const gStroke='stroke="rgba(110,130,140,.55)" stroke-width="1.2"';
  let s='';
  if(it.cat==='grinder'){
    if(it.kind==='hand'){
      s=`<rect x="98" y="34" width="4" height="30" fill="${metal}"/>
      <rect x="96" y="30" width="60" height="7" rx="3.5" fill="${metal}"/>
      <ellipse cx="156" cy="24" rx="9" ry="11" fill="${acc}"/>
      <rect x="77" y="60" width="46" height="12" rx="4" fill="${shade(base,-.2)}"/>
      <rect x="78" y="70" width="44" height="116" rx="7" fill="${body}"/>
      <rect x="76" y="126" width="48" height="7" rx="2" fill="${shade(base,-.32)}"/>
      <rect x="82" y="74" width="5" height="108" rx="2.5" fill="#fff" opacity=".18"/>`;
    }else{
      const top=it.kind==='hopper'
        ?`<path d="M70 82 L60 22 L140 22 L130 82 Z" fill="rgba(210,220,226,.42)" stroke="rgba(110,130,140,.5)" stroke-width="1.2"/><path d="M66 58 L134 58 L130 82 L70 82 Z" fill="#5B3A22" opacity=".85"/><rect x="58" y="16" width="84" height="8" rx="3" fill="${shade(base,-.15)}"/>`
        :`<rect x="78" y="52" width="44" height="30" rx="5" fill="${acc}"/><rect x="74" y="46" width="52" height="9" rx="4" fill="${shade(it.acc,-.25)}"/>`;
      s=`${top}
      <rect x="56" y="80" width="88" height="106" rx="12" fill="${body}"/>
      <rect x="76" y="126" width="48" height="56" rx="6" fill="#000" opacity=".55"/>
      <rect x="85" y="150" width="30" height="30" rx="4" fill="${metal}"/>
      <circle cx="100" cy="103" r="10" fill="${acc}"/><circle cx="100" cy="103" r="4" fill="${shade(base,-.4)}"/>
      <rect x="62" y="86" width="6" height="94" rx="3" fill="#fff" opacity=".14"/>`;
    }
  }else if(it.cat==='espresso'){
    if(it.kind==='robot'){
      s=`<ellipse cx="100" cy="181" rx="56" ry="8" fill="${body}"/>
      <path d="M100 168 L52 42" stroke="${body}" stroke-width="10" stroke-linecap="round"/>
      <path d="M100 168 L148 42" stroke="${body}" stroke-width="10" stroke-linecap="round"/>
      <circle cx="52" cy="40" r="9" fill="${acc}"/><circle cx="148" cy="40" r="9" fill="${acc}"/>
      <rect x="80" y="86" width="40" height="34" rx="6" fill="${metal}"/>
      <rect x="92" y="60" width="16" height="28" rx="3" fill="${metal}"/>
      <rect x="118" y="114" width="40" height="7" rx="3.5" fill="${dark}"/>
      <rect x="88" y="142" width="24" height="26" rx="3" fill="#F4F2EE" stroke="#cfcac2"/>`;
    }else if(it.kind==='flair'){
      s=`<rect x="44" y="174" width="112" height="12" rx="4" fill="${body}"/>
      <rect x="128" y="38" width="14" height="140" rx="4" fill="${body}"/>
      <path d="M136 44 L36 68" stroke="${metal}" stroke-width="8" stroke-linecap="round"/>
      <circle cx="36" cy="68" r="7" fill="${dark}"/>
      <rect x="78" y="78" width="44" height="46" rx="6" fill="${metal}"/>
      <rect x="84" y="124" width="32" height="8" rx="2" fill="${metal}"/>
      <rect x="114" y="124" width="34" height="7" rx="3.5" fill="${dark}"/>
      <rect x="88" y="146" width="24" height="26" rx="3" fill="#F4F2EE" stroke="#cfcac2"/>`;
    }else{
      const W=[0,92,120,140][it.w||2], x=100-W/2;
      s=`${it.builtIn?`<path d="M${x+8} 52 L${x+2} 14 L${x+46} 14 L${x+40} 52 Z" fill="rgba(210,220,226,.42)" stroke="rgba(110,130,140,.5)" stroke-width="1.2"/><path d="M${x+5} 34 L${x+43} 34 L${x+40} 52 L${x+8} 52Z" fill="#5B3A22" opacity=".85"/>`:''}
      <rect x="${x}" y="52" width="${W}" height="122" rx="9" fill="${body}"/>
      <rect x="${x+4}" y="48" width="${W-8}" height="7" rx="2" fill="${metal}"/>
      <rect x="${x+6}" y="56" width="5" height="112" rx="2.5" fill="#fff" opacity=".16"/>
      ${it.w>1?`<circle cx="${x+22}" cy="80" r="9" fill="#F6F5F2" stroke="${shade(base,-.4)}" stroke-width="2"/><path d="M${x+22} 80 l4 -4" stroke="#B33" stroke-width="1.5"/>`:''}
      <rect x="86" y="100" width="28" height="14" rx="3" fill="${metal}"/>
      <rect x="84" y="114" width="32" height="8" rx="2" fill="${metal}"/>
      <rect x="114" y="114" width="40" height="7" rx="3.5" fill="${acc}"/>
      ${it.milk?`<path d="M${x+6} 90 L${x-4} 92 L${x-6} 156" fill="none" stroke="${metal}" stroke-width="3.5" stroke-linecap="round"/>`:''}
      <rect x="${x+8}" y="172" width="${W-16}" height="14" rx="3" fill="${shade(base,-.35)}"/>
      <rect x="90" y="144" width="20" height="26" rx="3" fill="#F4F2EE" stroke="#cfcac2"/>`;
    }
  }else if(it.cat==='brewer'){
    const fill=isGlass?glass:body;
    const k=it.kind;
    if(k==='cone'){
      s=`<rect x="74" y="122" width="52" height="64" rx="10" fill="${glass}" ${gStroke}/>
      <path d="M78 160 h44 v18 a8 8 0 0 1 -8 8 h-28 a8 8 0 0 1 -8 -8z" fill="#4B2C17" opacity=".75"/>
      <ellipse cx="100" cy="120" rx="34" ry="5" fill="${isGlass?'rgba(160,175,182,.7)':shade(base,-.2)}"/>
      <path d="M58 52 L142 52 L114 116 L86 116 Z" fill="${fill}" ${isGlass?gStroke:''}/>
      <rect x="54" y="46" width="92" height="8" rx="3" fill="${isGlass?'rgba(160,175,182,.8)':shade(base,-.1)}"/>
      ${it.col==='glass'?`<path d="M142 58 q16 2 14 18 q-2 12 -18 10" fill="none" stroke="${it.acc}" stroke-width="5" opacity=".75"/>`:''}
      ${it.ribs?[66,78,90,102,114,126].map(xx=>`<path d="M${xx} 54 L${100+(xx-100)*.33} 114" stroke="${shade(base,-.18)}" stroke-width="2"/>`).join(''):''}`;
    }else if(k==='chemex'){
      s=`<path d="M58 22 L142 22 L108 98 L144 176 Q100 194 56 176 L92 98 Z" fill="${glass}" ${gStroke}/>
      <path d="M68 160 Q100 150 132 160 L140 176 Q100 192 60 176 Z" fill="#4B2C17" opacity=".7"/>
      <path d="M88 86 L112 86 L118 114 L82 114 Z" fill="${acc}"/>
      <circle cx="122" cy="104" r="4" fill="${shade(it.acc,-.3)}"/><path d="M118 100 L128 120" stroke="${shade(it.acc,-.3)}" stroke-width="1.5"/>`;
    }else if(k==='steep'){
      s=`<ellipse cx="100" cy="182" rx="38" ry="7" fill="${acc}"/>
      <rect x="90" y="132" width="20" height="48" rx="4" fill="${acc}"/>
      <path d="M56 42 L144 42 L118 136 L82 136 Z" fill="${fill}" ${gStroke}/>
      <path d="M64 70 L136 70 L118 136 L82 136 Z" fill="#4B2C17" opacity=".7"/>
      <rect x="52" y="36" width="96" height="8" rx="3" fill="${acc}"/>`;
    }else if(k==='aeropress'){
      s=`<rect x="70" y="20" width="60" height="8" rx="3" fill="${acc}"/>
      <rect x="78" y="26" width="44" height="80" rx="3" fill="${acc}" opacity=".85"/>
      <rect x="72" y="76" width="56" height="94" rx="4" fill="${glass}" ${gStroke}/>
      <rect x="74" y="122" width="52" height="46" rx="2" fill="#4B2C17" opacity=".7"/>
      <rect x="64" y="166" width="72" height="10" rx="3" fill="${acc}"/>
      <rect x="82" y="176" width="36" height="10" rx="2" fill="${acc}" opacity=".7"/>`;
    }else if(k==='press'){
      s=`<path d="M100 10 v40" stroke="${metal}" stroke-width="4"/><circle cx="100" cy="10" r="8" fill="${dark}"/>
      <rect x="62" y="46" width="76" height="10" rx="3" fill="${metal}"/>
      <rect x="66" y="56" width="68" height="120" rx="3" fill="${glass}" ${gStroke}/>
      <rect x="68" y="104" width="64" height="70" rx="2" fill="#3E220F" opacity=".85"/>
      <rect x="62" y="56" width="6" height="128" fill="${metal}"/><rect x="132" y="56" width="6" height="128" fill="${metal}"/>
      <rect x="60" y="172" width="80" height="14" rx="3" fill="${metal}"/>
      <path d="M138 70 q30 0 30 36 q0 34 -30 44" fill="none" stroke="${dark}" stroke-width="10" stroke-linecap="round"/>`;
    }else if(k==='moka'){
      s=`<path d="M70 118 L130 118 L124 186 L76 186 Z" fill="${body}"/>
      <rect x="68" y="112" width="64" height="9" rx="2" fill="${shade(base,-.3)}"/>
      <path d="M72 112 L128 112 L136 48 L64 48 Z" fill="${body}"/>
      <path d="M64 48 L52 40 L66 56 Z" fill="${shade(base,-.1)}"/>
      <rect x="62" y="40" width="76" height="9" rx="3" fill="${shade(base,-.15)}"/>
      <ellipse cx="100" cy="34" rx="7" ry="6" fill="${dark}"/>
      <path d="M134 58 L164 60 L158 108" fill="none" stroke="${dark}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="76" y="56" width="5" height="52" rx="2.5" fill="#fff" opacity=".25"/>`;
    }else{
      s=`<rect x="118" y="16" width="40" height="170" rx="8" fill="${body}"/>
      <rect x="46" y="16" width="112" height="26" rx="8" fill="${body}"/>
      <path d="M58 44 L112 44 L104 82 L66 82 Z" fill="${shade(base,-.25)}"/>
      <rect x="54" y="98" width="62" height="78" rx="12" fill="${glass}" ${gStroke}/>
      <rect x="57" y="134" width="56" height="40" rx="9" fill="#3E220F" opacity=".8"/>
      <rect x="50" y="94" width="70" height="8" rx="3" fill="${dark}"/>
      <path d="M54 112 q-16 0 -16 22 q0 20 16 22" fill="none" stroke="${dark}" stroke-width="7"/>
      <rect x="46" y="176" width="112" height="10" rx="3" fill="${shade(base,-.3)}"/>
      <circle cx="138" cy="150" r="4" fill="${it.acc==='#222222'?'#E05A3A':'#7FD3A0'}"/>`;
    }
  }else if(it.cat==='kettle'){
    s=`<path d="M64 150 C36 150 34 104 18 76" fill="none" stroke="${body}" stroke-width="7" stroke-linecap="round"/>
    <path d="M60 182 L58 122 Q60 90 100 88 Q140 90 142 122 L140 182 Z" fill="${body}"/>
    <ellipse cx="100" cy="92" rx="32" ry="6" fill="${shade(base,-.2)}"/>
    <path d="M94 86 h12 v-8 a6 6 0 0 0 -12 0z" fill="${acc}"/>
    <path d="M140 106 L166 98 L162 170 L140 166" fill="none" stroke="${acc}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

function sectionItems(c){const all=filtered(c,S.filters[c.key]||[]),n=cols(),max=n*5,show=all.length>max?all.slice(0,max-1):all;return {all,show,n,more:all.length>max?all.length-show.length:0}}
function thumbEl(it){const b=document.createElement('button');b.className='tb';b.dataset.open=it.id;b.setAttribute('aria-label',it.name);b.title=it.name;b.innerHTML=pic(it);return b}

const pending={};
function drawSection(c,animate){
  const el=main.querySelector(`[data-thumbs="${c.key}"]`);if(!el)return;
  renderPills(c);
  const old=new Map([...el.querySelectorAll('.tb[data-open]')].map(b=>[b.dataset.open,b]));
  const build=()=>{
    const {all,show,n,more}=sectionItems(c), ids=new Set(show.map(x=>x.id));
    el.style.setProperty('--cols',n);
    const first=new Map();if(animate&&!reduce)old.forEach((b,id)=>{if(ids.has(id)&&b.isConnected)first.set(id,b.getBoundingClientRect())});
    if(!all.length){el.innerHTML=`<p class="ms" style="grid-column:1/-1">${(LOAD==='ready'||LOAD==='stale')&&items(c).length?'Nothing here matches your answers. Remove a filter to see more.':loadingMsg(c)}</p>`;return}
    const frag=document.createDocumentFragment(), entering=[];
    show.forEach(it=>{let b=old.get(it.id);if(!b){b=thumbEl(it);entering.push(b)}b.getAnimations().forEach(x=>x.cancel());b.style.pointerEvents='';frag.appendChild(b)});
    if(more){const m=document.createElement('a');m.className='tb more';m.href='#'+c.key;m.setAttribute('aria-label',`View all ${all.length.toLocaleString('en-US')} ${c.short}`);m.innerHTML=`${more.toLocaleString('en-US')}<span>more</span>`;frag.appendChild(m)}

    if(!animate||reduce)return;
    first.forEach((r,id)=>{const b=old.get(id),l=b.getBoundingClientRect(),dx=r.left-l.left,dy=r.top-l.top;
      if(Math.abs(dx)>1||Math.abs(dy)>1)b.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})});
    entering.forEach((b,i)=>b.animate([{opacity:0},{opacity:1}],{duration:300,delay:150+Math.min(i,20)*10,fill:'backwards'}));
  };

    const keep=new Set(sectionItems(c).show.map(x=>x.id)), leaving=[...old].filter(([id])=>!keep.has(id)).map(([,b])=>b);

    }
  }
  build();
}

/* ---------- setup assistant: follows the conversation tree ---------- */
const STEPS={
  drinks:{q:'What do you like to drink?',sub:'Pick all that apply',multi:true,
    o:[['espresso','Espresso'],['milk','Lattes & cappuccinos'],['americano','Americano'],['filter','Pour-over or drip']]},
  hands:{q:'How hands-on do you want to be?',o:[['lever','Manual lever','Pull every shot by hand'],['semi','Semi-automatic','You start and stop the shot'],['guided','Let the machine help','Built-in grinder or automatic milk']]},
  brew:{q:'How do you like to brew?',o:[['pourover','Pour-over'],['immersion','Immersion, like an AeroPress'],['press','French press'],['machine','Drip machine']]},
  kit:{q:'Do you have a gooseneck kettle and a scale?',o:[['have','Yes, both'],['add','Add them to my setup']]},
  grinder:{q:'Do you already have a grinder?',o:[['yes','Yes'],['no','No, help me pick one']]},
  gtype:{tune:'Fine-tune grinders',q:'What kind of grinder?',hint:'Your choice adds a filter to the grinders on the left.',
    o:[['single','Single dose','Weigh beans for each shot'],['hopper','Hopper','Fill it up, grind on demand'],['hand','Hand grinder','Quiet and portable'],['any','Not sure','Show me all of them']]},
  budget:{q:'What do you want to spend in total?',o:[['lo',()=>`Under ${money(nice(300))}`],['mid',()=>`${money(nice(300))} to ${money(nice(800))}`],['hi',()=>`${money(nice(800))} and up`],['any','Show me everything']]}
};
const A=()=>S.chat;
const wantsEsp=a=>a.easy||(a.drinks||[]).some(d=>d!=='filter');
const wantsFil=a=>!a.easy&&(a.drinks||[]).includes('filter');
function order(a){
  const s=['drinks'];if(!a.drinks&&!a.easy)return s;
  if(wantsEsp(a)&&!a.easy)s.push('hands');
  if(wantsFil(a)){s.push('brew');if(a.brew&&a.brew!=='machine')s.push('kit')}
  if(!a.easy){s.push('grinder');if(a.grinder==='no')s.push('gtype')}
  s.push('budget');return s;
}
const optLabel=o=>typeof o[1]==='function'?o[1]():o[1];
function answerText(k,a){
  if(k==='drinks')return a.easy?'Not sure, just make it easy':STEPS.drinks.o.filter(o=>a.drinks.includes(o[0])).map(o=>o[1]).join(', ');
  const o=STEPS[k].o.find(x=>x[0]===a[k]);return o?optLabel(o):'';
}
let picks=new Set();   // drinks ticked but not yet confirmed
function grinderFilters(a){
  const f=[wantsEsp(a)?'espresso':'filter'];
  if(a.gtype==='single')f.push('single');else if(a.gtype==='hopper')f.push('hopper');else if(a.gtype==='hand')f.push('hand');
  return f;
}
function answer(k,v){
  const a=A(), steps=order(a);
  steps.slice(steps.indexOf(k)).forEach(s=>{delete a[s];if(s==='drinks')delete a.easy});
  if(k==='drinks'&&v==='easy')a.easy=true;else a[k]=v;
  save();applyChat();renderSide();
}
function undoTo(k){const a=A(),steps=order(a);steps.slice(steps.indexOf(k)).forEach(s=>{delete a[s];if(s==='drinks')delete a.easy});picks=new Set();save();applyChat();renderSide()}
function startOver(){S.chat={};picks=new Set();LOG=[];save();applyChat();renderSide()}
function chatFilters(a){
  const f={}, d=a.drinks||[];
  if(a.easy)f.espresso=['guided'];else{const e=[];if(a.hands)e.push(a.hands);if(d.includes('milk'))e.push('milk');if(e.length)f.espresso=e}
  if(a.brew)f.brewers=[a.brew];
  if(a.grinder==='no')f.grinders=grinderFilters(a);
  if(d.length||a.easy){const esp=wantsEsp(a),fil=wantsFil(a);if(esp!==fil)f.beans=[esp?'forEsp':'forFil']}
  return f;
}
const CHAT_CATS=['espresso','brewers','grinders','beans'];
let lastChat={};
function applyChat(){
  const f=chatFilters(A()), touched=[];
  CHAT_CATS.forEach(k=>{const was=JSON.stringify(lastChat[k]||[]),now=JSON.stringify(f[k]||[]);if(was!==now){S.filters[k]=f[k]||[];touched.push(k)}});
  lastChat=f;S.chatFilters=f;save();refreshFilters(touched);
}

// a suggested setup that fits the answers and the budget
function suggest(a){
  const cap={lo:300,mid:800,hi:1e9,any:1e9}[a.budget]||1e9;
  const need=[];
  const pool=(cat,f)=>GEAR.filter(g=>g.cat===cat&&f(g)).sort(byPop).slice(0,12);
  if(wantsEsp(a)){const e=a.easy?g=>g.effort===1:CATS[0].groups[0].find(o=>o[0]===a.hands)?.[2]||(g=>true);
    need.push(pool('espresso',g=>e(g)&&(!(a.drinks||[]).includes('milk')||g.milk)))}
  if(wantsFil(a)){const b=CATS[2].groups[0].find(o=>o[0]===a.brew);need.push(pool('brewer',b?b[2]:g=>true))}
  if(a.grinder==='no'){const f=grinderFilters(a), c=CATS[1];need.push(pool('grinder',g=>c.groups.every(gr=>{const on=gr.filter(o=>f.includes(o[0]));return !on.length||on.some(o=>o[2](g))})))}
  if(a.kit==='add'){need.push(pool('kettle',g=>true));need.push(pool('scale',g=>g.use!=='espresso'))}
  need.push(pool('bean',g=>wantsEsp(a)?g.for!=='filter':g.for!=='espresso'));
  const lists=need.filter(l=>l.length), pick=lists.map(()=>0);
  const total=()=>lists.reduce((s,l,i)=>s+(l[pick[i]].price||0),0);
  for(let n=0;n<80&&total()>cap;n++){
    // swap the priciest pick for a cheaper option in the same list
    let best=-1,gain=0;
    lists.forEach((l,i)=>{const cur=l[pick[i]].price||0;const j=l.findIndex(x=>(x.price||0)<cur);if(j>=0&&cur-(l[j].price||0)>gain){best=i;gain=cur-(l[j].price||0)}});
    if(best<0)break;const l=lists[best], cur=l[pick[best]].price||0;pick[best]=l.findIndex(x=>(x.price||0)<cur);
  }
  return {items:lists.map((l,i)=>l[pick[i]]),fits:total()<=cap};
}
function kitHtml(list,showTotal=true){
  const tot=list.reduce((s,it)=>s+(it.price||0),0);
  return `<div class="kit">${list.map(it=>`<button class="kit-row" data-open="${esc(it.id)}"><span class="th">${pic(it)}</span><span><b>${esc(it.name)}</b><small>${({espresso:'Espresso machine',grinder:'Grinder',brewer:'Brewer',kettle:'Kettle',scale:'Scale',bean:'Beans'})[it.cat]||''}</small></span><span class="pz">${money(it.price||0)}</span></button>`).join('')}
    ${showTotal?`<div class="kit-tot"><span>Total</span><span>${money(tot)}</span></div>`:''}</div>`;
}
const thread=document.getElementById('thread'), sugg=document.getElementById('sugg');
function stepHtml(k,a){
  const st=STEPS[k];
  if(k==='drinks')return `<h3 class="qh">Your coffee setup, dialled in for less</h3><p class="qs" style="margin:0">For home baristas and café owners. Find the right gear and beans, keep track of what you own, and catch the deals, so every cup is great without overspending.</p><p class="qsmall">${st.q} <span>· ${st.sub}</span></p>
    <div class="ans">${st.o.map(o=>`<button data-pick="${o[0]}" aria-pressed="${picks.has(o[0])}">${o[1]}<span class="box">${ico('check')}</span></button>`).join('')}
    <button class="go" data-confirm ${picks.size?'':'disabled'}>Continue</button><button data-ans="drinks" data-v="easy">Not sure, just make it easy</button></div>`;
  const opts=`<div class="ans">${st.o.map(o=>`<button data-ans="${k}" data-v="${o[0]}"><span>${optLabel(o)}${o[2]?`<small>${o[2]}</small>`:''}</span></button>`).join('')}</div>`;
  if(st.tune)return `<div class="tune"><p class="qlab">${st.tune}</p><h3 class="qh" style="font-size:20px">${st.q}</h3>${opts}<p class="hint">${st.hint}</p></div>`;
  return `<h3 class="qh">${st.q}</h3>${opts}`;
}
function renderSide(){
  const a=A(), steps=order(a);let h='';
  for(const k of steps){
    const done=k==='drinks'?(a.drinks||a.easy):a[k];
    if(done){h+=`<p class="past">${STEPS[k].q}</p><button class="me" data-undo="${k}" title="Change this answer">${esc(answerText(k,a))}</button>`;continue}
    if(LOAD==='loading'&&k!=='drinks'){h+='<p class="past">Loading the catalog…</p>';break}
    h+=stepHtml(k,a);break;
  }
  if(steps.every(k=>k==='drinks'?(a.drinks||a.easy):a[k])){
    const r=suggest(a);
    h+=r.items.length?`<p class="bot">${r.fits?'Here’s a setup that fits:':'This is the closest I can get to that budget:'}</p>${kitHtml(r.items)}
      <div class="row-acts"><button class="soft dark" data-save>Save to my setup</button><button class="soft" data-restart>Start over</button></div>`
      :`<p class="bot">${loadingMsg()}</p>`;
  }
  h+=LOG.map(m=>m.me?`<p class="me">${esc(m.me)}</p>`:`<div class="bot">${m.html}</div>`).join('');
  thread.innerHTML=h;
  const n=S.setup.filter(byId).length;
  sugg.innerHTML=`<button class="chip" data-say="setup">My setup${n?` (${n})`:''}</button><button class="chip" data-say="currency">Change currency</button>${Object.keys(a).length?'<button class="chip" data-restart>Start over</button>':''}`;
  thread.scrollTop=thread.scrollHeight;
}
document.getElementById('side').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pick){const v=t.dataset.pick;picks.has(v)?picks.delete(v):picks.add(v);renderSide();thread.querySelector(`[data-pick="${v}"]`)?.focus();return}
  if('confirm' in t.dataset){if(picks.size){const v=[...picks];picks=new Set();answer('drinks',v)}return}
  if(t.dataset.ans){answer(t.dataset.ans,t.dataset.v);return}
  if(t.dataset.undo){undoTo(t.dataset.undo);return}
  if(t.dataset.open){openProduct(t.dataset.open);return}
  if('save' in t.dataset){const r=suggest(A());S.setup=[...new Set([...S.setup,...r.items.map(x=>x.id)])];save();toast('Saved to your setup');renderSide();return}
  if('restart' in t.dataset){startOver();return}
  if(t.dataset.cur){S.cur=t.dataset.cur;save();LOG.push({html:`Prices are now in ${esc(S.cur)}.`});renderMain(false);renderSide();return}
  if(t.dataset.say){reply(t.dataset.say==='setup'?'What’s in my setup?':'Change currency');return}
});
function setupReply(){
  const its=S.setup.map(byId).filter(Boolean);
  return its.length?`You have ${its.length} thing${its.length>1?'s':''} saved:${kitHtml(its)}<p class="past" style="margin-top:8px">Prices in ${esc(cur())}.</p>`
    :'Nothing saved yet. Finish the questions above, or open any product and choose “Add to my setup”.';
}
function reply(text){
  const q=text.trim();if(!q)return;LOG.push({me:q});
  const low=q.toLowerCase(), code=(low.match(/\b(usd|cad|eur|gbp|aud)\b/)||[])[1];
  if(code&&FX[code.toUpperCase()]){S.cur=code.toUpperCase();save();renderMain(false);LOG.push({html:`Prices are now in ${S.cur}.`})}
  else if(/currenc|price in|prices in/.test(low)){const cs=Object.keys(CURS).filter(c=>FX[c]);LOG.push({html:`Prices are in ${esc(cur())}. Pick another currency:<div class="row-acts" style="margin-top:8px">${cs.map(c=>`<button class="soft${c===cur()?' dark':''}" data-cur="${c}">${c}</button>`).join('')}</div>`})}
  else if(/setup|saved|my kit/.test(low))LOG.push({html:setupReply()});
  else{
    const words=low.split(/\s+/).filter(w=>w.length>2);
    const hits=GEAR.filter(it=>{const t=[it.name,it.brand,it.roaster,it.origin,sub(it)].join(' ').toLowerCase();return t.includes(low)||words.length&&words.every(w=>t.includes(w))}).sort(byPop).slice(0,4);
    LOG.push({html:hits.length?`Here’s what I found in the catalog for “${esc(q)}”:${kitHtml(hits,false)}`:`I couldn’t find “${esc(q)}” in the catalog. Try a product name, brand or roaster.`});
  }
  renderSide();
}

function specs(it){

    grinder:()=>[['Type',it.kind==='hand'?'Hand grinder':it.kind==='hopper'?'Electric, hopper':'Electric, single dose'],['Burrs',it.burr],['Grinds for',(it.does||[]).join(' and ')]],
    espresso:()=>[['Heating',it.heat],['Steam wand',it.milk?(it.auto?'Yes, automatic':'Yes'):'No'],['Grinder',it.builtIn?'Built in':'Buy separately'],['Footprint',['','Compact','Medium','Large'][it.w]]],
    brewer:()=>[['Method',it.method],['Makes',`Up to ${it.cap} cup${it.cap>1?'s':''}`],['You also need',it.needs]],
    kettle:()=>[['Heat',it.electric?'Electric base':'Stovetop'],['Temperature control',it.temp?'Yes':'No'],['Spout','Gooseneck']],
    scale:()=>[['Features',it.spec],['Best for',{both:'Espresso and pour-over',espresso:'Espresso',pourover:'Pour-over'}[it.use]]]})[it.cat]();
  return `<dl class="specs">${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buyLinks(it,q){

}

function renderCur(){}

function mergeCatalog(){
  const live=x=>x.status!=='discontinued';
  GEAR=[...RAW.gear.filter(live),...RAW.beans.filter(live).map(b=>({...b,cat:'bean'}))];
}
async function boot(){
  const cfg=window.CATALOG_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){LOAD='offline';renderAll(true);return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  await loadCatalog(true);
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;setTimeout(checkAdmin,0)});
  const {data}=await SB.auth.getSession();SESSION=data.session;checkAdmin();
  if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
  if(location.hash==='#owner'&&!SESSION)openSignIn();
}
/* Loading, fastest first: gear (small) draws the page right away, beans follow.
   Beans come without their long fields (description, notes, links); a product popup fetches those.
   The last catalog is kept on this device so a return visit draws immediately, then refreshes. */
const BEAN_FIELDS='id,name:doc->>name,roaster:doc->>roaster,origin:doc->>origin,roast:doc->>roast,for:doc->>for,flavor:doc->>flavor,degree:doc->>degree,price:doc->price,size_g:doc->size_g,img:doc->>img,pop:doc->pop,status:doc->>status,source:doc->>source';
const CACHE_KEY='cc-catalog-1';
let BEANS_LOADING=true;
const asItem=r=>r.doc?{id:r.id,...r.doc}:{...r};
async function rows(table,cols,count){
  // pages of 1,000 fetched side by side
  if(!count){const out=[];for(let f=0;;f+=1000){const r=await SB.from(table).select(cols).order('id').range(f,f+999);if(r.error)return r;out.push(...r.data);if(r.data.length<1000)return {data:out}}}
  const pages=await Promise.all(Array.from({length:Math.ceil(count/1000)},(_,i)=>SB.from(table).select(cols).order('id').range(i*1000,i*1000+999)));
  const bad=pages.find(r=>r.error);return bad||{data:pages.flatMap(r=>r.data)};
}
async function countOf(table){try{const r=await SB.from(table).select('id',{count:'exact',head:true});return typeof r.count==='number'?r.count:0}catch(e){return 0}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.gear&&c.beans){RAW.gear=c.gear;RAW.beans=c.beans;if(c.fx)FX=c.fx;mergeCatalog();LOAD='stale';BEANS_LOADING=false;return true}}catch(e){}return false}
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),gear:RAW.gear,beans:RAW.beans,fx:FX}))}catch(e){}}
function redraw(first){if(first)renderAll(true);else{renderMain(false);renderSide()}}
async function loadCatalog(first){
  const cached=first&&readCache();
  if(cached)redraw(true);
  try{
    const beansP=countOf('beans').then(n=>rows('beans',BEAN_FIELDS,n));   // starts now, alongside gear
    const [g,m]=await Promise.all([rows('gear','id,doc'),SB.from('meta').select('id,doc').eq('id','fx').maybeSingle()]);
    if(g.error)throw g.error;
    RAW.gear=g.data.map(asItem);
    if(m.data&&m.data.doc&&m.data.doc.rates)FX={USD:1,...m.data.doc.rates};
    mergeCatalog();LOAD='ready';
    if(!cached)redraw(first);
    const b=await beansP;
    if(b.error)throw b.error;
    const full=new Map(RAW.beans.filter(x=>x._full).map(x=>[x.id,x]));
    RAW.beans=b.data.map(asItem).map(x=>full.get(x.id)||x);
    BEANS_LOADING=false;mergeCatalog();writeCache();
  }catch(e){LOAD=GEAR.length?'stale':'offline';BEANS_LOADING=false}
  redraw(first&&!cached&&LOAD==='offline');
}
async function fullBean(id){
  const it=byId(id);if(!it||it.cat!=='bean'||it._full||!SB)return;
  try{const {data}=await SB.from('beans').select('id,doc').eq('id',id).maybeSingle();
    if(data&&data.id===id){const x={...asItem(data),_full:true};const i=RAW.beans.findIndex(b=>b.id===id);if(i>=0)RAW.beans[i]=x;mergeCatalog()}}catch(e){}
}
async function checkAdmin(){
  isEditor=false;renderSign();
  if(SESSION){const {data}=await SB.rpc('is_admin');isEditor=data===true}
  if(isEditor)await loadPending();else{PENDING=[];updateReviewBtn()}

function openAbout(){

    <p>catalog.cafe helps you build a coffee setup. Answer a few questions and it narrows the catalog to the grinders, espresso machines, brewers, kettles, scales and beans that fit how you drink coffee.</p>

/* ---------- review queue (editors only) ---------- */
const KIND={add:'New',update:'Update',discontinue:'Discontinue'};
function fmtVal(k,v){if(k==='price')return money(Number(v)||0);if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.label||x.title||''):x).join(', ');if(v&&typeof v==='object')return JSON.stringify(v);return String(v)}
function propHtml(p){
  let body='';
  if(p.kind==='update'&&p.changes){
    body=`<div class="diff">${Object.keys(p.changes).map(k=>`<span>${esc(k)}</span><span>${p.previous&&p.previous[k]!==undefined?`<s>${esc(fmtVal(k,p.previous[k]))}</s> → `:''}${esc(fmtVal(k,p.changes[k]))}</span>`).join('')}</div>`;
  }else if(p.kind==='add'&&p.data){
    const d=p.data;body=`<div class="diff"><span>price</span><span>${esc(money(Number(d.price)||0))}</span>${['brand','roaster','origin','burr','heat','roast'].filter(k=>d[k]).map(k=>`<span>${k}</span><span>${esc(d[k])}</span>`).join('')}</div>`;
  }
  const src=(p.sources||[]).map(x=>({t:x.title||x.url,u:safeUrl(x.url)})).filter(x=>x.u).slice(0,4);
  return `<div class="prop"><div class="top"><span class="what">${esc(p.item_name||p.doc_id)}</span><span class="kind">${KIND[p.kind]||esc(p.kind)}${(()=>{const c=p.collection==='beans'?'bean':((p.data&&p.data.cat)||(RAW.gear.find(g=>g.id===p.doc_id)||{}).cat||'');return c?' · '+esc(c==='espresso'?'machine':c):''})()}</span></div>
    ${p.reason?`<div class="why">${esc(p.reason)}</div>`:''}${body}
    ${src.length?`<div class="src">${src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t).slice(0,48)} ↗</a>`).join('')}</div>`:''}
    <div class="acts"><button class="ok" data-ok="${esc(p.id)}">Approve</button><button class="no" data-no="${esc(p.id)}">Reject</button></div></div>`;
}
async function decide(id,ok){
  const {error}=await SB.rpc(ok?'apply_proposal':'reject_proposal',{pid:id});
  if(error){toast('Couldn’t save that. Try again.');return false}
  toast(ok?'Approved':'Rejected');
  PENDING=PENDING.filter(p=>p.id!==id);updateReviewBtn();
  if(layer.querySelector('#reviewList'))openReview();
  return true;
}
function openReview(){
  openModal(`<h2 class="mt">Review queue</h2><p class="ms">${PENDING.length?`${PENDING.length} change${PENDING.length>1?'s':''} from the research agent`:'All caught up'}</p>
    ${PENDING.length>1?`<div class="allbar"><span class="ms" style="margin:0">Approve applies the change to the live site.</span><button class="pill" id="okAll">Approve all</button></div>`:''}
    <div id="reviewList">${PENDING.map(propHtml).join('')}</div>`);
  const list=document.getElementById('reviewList');
  list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;b.disabled=true;const ok=!!b.dataset.ok;if(await decide(b.dataset.ok||b.dataset.no,ok)&&ok)loadCatalog(false)});
  const all=document.getElementById('okAll');
  if(all)all.onclick=async()=>{all.disabled=true;for(const p of [...PENDING])await decide(p.id,true);loadCatalog(false)};
}
document.getElementById('reviewBtn').onclick=openReview;

function renderAll(){renderMain(false);renderSide();renderSign()}
function layout(){renderMain(false)}
function renderSheet(){renderSide()}
if(location.hash!=='#owner')route();renderSide();renderSign();boot();
