<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catalog Cafe</title>
<meta name="description" content="Plan your coffee setup: browse espresso machines, grinders, brewers, kettles, scales and beans, and let the setup assistant suggest a kit that fits your budget.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Catalog Cafe — one stylesheet, one rule per component. Mirrors the Catalog Cafe design system:
   primitives first, then semantic roles; component rules use semantic tokens only.
   Type: 24 Light for the one title per view, 15 for reading, 13 for supporting text, 10 for news dates and sources (13 on phones).
   Medium (500) only for news labels and the bento-title hover.
   Radii: compact (8) for small controls and rows, option (16) for cards and panels, surface (24) for the
   product container and modals, control (pill) for pills and round buttons. */
:root{
  --grey-0:#ffffff; --grey-25:#fafafa; --grey-50:#f5f5f5; --grey-100:#f0f0f0; --grey-150:#e8e8e8; --grey-200:#e2e2e2; --grey-400:#a0a0a0; --grey-500:#6b6b6b;
  --grey-700:#323232; --grey-750:#2f2f2f; --grey-800:#262626; --grey-825:#212121; --grey-850:#1c1c1c; --grey-900:#111111; --bronze-300:#e0a45a; --bronze-600:#96601c; --blue-50:#ebf2fc; --blue-300:#6ea6f7; --blue-600:#0951b9;

  --text-primary:var(--grey-900); --text-secondary:var(--grey-500); --text-on-action:var(--grey-0); --text-on-accent:var(--grey-0); --text-highlight:var(--blue-600); --icon-inactive:var(--grey-400);
  --surface-page:var(--grey-50); --surface-raised:var(--grey-0); --surface-control:var(--grey-100); --surface-control-hover:var(--grey-150); --surface-hover-subtle:var(--grey-25); --surface-sunken:var(--grey-200); --surface-highlight:var(--blue-50);
  --border-subtle:var(--grey-200); --border-control:var(--grey-400); --action-primary:var(--grey-900); --accent:var(--bronze-600);
  --overlay-scrim:rgba(17,17,17,.32); --overlay-frost:rgba(245,245,245,.4);
  --shadow-raised:0 12px 48px rgba(17,17,17,.10); --shadow-hover:0 1px 2px rgba(17,17,17,.025),0 4px 12px rgba(17,17,17,.035);

  --gap-tight:4px; --gap-stack:8px; --gap-controls:12px; --gap-section:24px; --inset-control:16px; --inset-surface:24px;
  --gutter-page:24px; --gutter-page-wide:32px; --gutter-page-compact:16px;
  --radius-compact:8px; --radius-option:16px; --radius-surface:24px; --radius-control:999px;
  --width-chat:360px; --width-search:560px; --height-header:64px; --height-footer:44px; --height-control-sm:32px; --height-row:44px;
  --font-sans:"Helvetica Neue",Helvetica,Arial,sans-serif; --font-size-heading:24px; --font-size-body:15px; --font-size-caption:13px; --font-size-meta:10px; --font-weight-label:500;
  color-scheme:light;
}
/* Light only: there is no dark theme (product photos are shot for light backgrounds). */

/* ---------- base ---------- */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-weight:400;font-size:var(--font-size-body);line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:400}
:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout: header across the top, chat column left, product container right, footer under it ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--width-chat) minmax(0,1fr);grid-template-rows:var(--height-header) minmax(0,1fr) auto;background:var(--surface-page)}
/* header: wordmark and links grouped in the centre; no indicator for the current page */
.top2{grid-column:1/-1;position:relative;display:flex;align-items:center;justify-content:center;padding:0 var(--inset-surface)}
.hnav{display:flex;align-items:center;gap:var(--gap-section)}
.logo{color:var(--text-primary);text-decoration:none;font-size:var(--font-size-body);letter-spacing:-.01em}
.navs{display:flex;align-items:center;gap:var(--gap-tight)}
.navl{display:inline-flex;align-items:center;height:var(--height-control-sm);padding:0 var(--gap-controls);border:0;border-radius:var(--radius-control);background:none;color:var(--text-primary);text-decoration:none;font-size:var(--font-size-body)}
@media (hover:hover){.navl:hover{background:var(--surface-control)}}
.top2 .review{position:absolute;right:var(--inset-surface)}
.chatcol{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.main{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-right:var(--inset-surface);background:var(--surface-raised);border-radius:var(--radius-surface)}
.foot{grid-column:2;grid-row:3;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:var(--inset-control);min-height:var(--height-footer);padding:0 var(--inset-surface) env(safe-area-inset-bottom,0px) 0;font-size:var(--font-size-caption);color:var(--text-secondary)}
.foot button,.foot a{border:0;background:none;padding:0;font-size:inherit;color:inherit;text-decoration:none}
@media (hover:hover){.foot button:hover,.foot a:hover{color:var(--text-primary)}}

/* ---------- buttons: one small size (32px, compact radius) for every in-flow action ---------- */
.go,.ghost,.soft,.review,.pill,.prop .acts button{height:var(--height-control-sm);padding:0 14px;border-radius:var(--radius-compact);font-size:var(--font-size-caption);display:inline-flex;align-items:center;justify-content:center;gap:var(--gap-tight);border:0}
.go,.soft.dark,.prop .ok{background:var(--action-primary);color:var(--text-on-action)}
.go[disabled]{opacity:.35;cursor:default}
.ghost{border:1px solid var(--border-control);background:none;color:var(--text-primary)}
.soft,.pill,.prop .no{background:var(--surface-control);color:var(--text-primary)}
@media (hover:hover){.ghost:hover,.soft:not(.dark):hover,.pill:hover,.prop .no:hover{background:var(--surface-control-hover)}}
.review{background:var(--accent);color:var(--text-on-accent)}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:var(--radius-control);display:grid;place-items:center;color:var(--text-primary);flex:none}
@media (hover:hover){.icon-btn:hover{background:var(--surface-control)}}
.icon-btn.sm{width:var(--height-control-sm);height:var(--height-control-sm);color:var(--text-secondary)}
.icon-btn.sm .ic{width:18px;height:18px}

/* ---------- pills (filters, recognised words) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
.chip{border:1px solid var(--border-subtle);background:none;border-radius:var(--radius-control);height:30px;padding:0 12px;font-size:var(--font-size-caption);display:inline-flex;align-items:center;gap:var(--gap-tight);color:var(--text-primary)}
.chip[aria-pressed="true"]{background:var(--action-primary);border-color:var(--action-primary);color:var(--text-on-action);padding-right:var(--gap-stack)}
.chip .ic{width:14px;height:14px}
.kw{display:inline-flex;align-items:center;height:26px;padding:0 10px;margin:var(--gap-tight) 6px 0 0;border-radius:var(--radius-control);background:var(--surface-raised);color:var(--text-highlight);font-size:var(--font-size-caption)}

/* ---------- product container: families of bentos ---------- */
.groups{padding:var(--inset-control)}
.groups.catpage{padding-top:var(--gap-stack)}
.bentos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--inset-control)}
@media (max-width:1180px){.bentos{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* bento: a faint fill, no border; hover adds a whisper of shadow and nothing moves */
.bento{position:relative;overflow:hidden;background:var(--surface-hover-subtle);border-radius:var(--radius-option);padding:var(--inset-control) var(--inset-control) var(--gap-stack);cursor:pointer;outline-offset:3px}
@media (hover:hover){.bento:not(.empty):hover{box-shadow:var(--shadow-hover);transition:box-shadow .15s ease-out}}
.b-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--gap-controls);margin-bottom:var(--gap-controls)}
.sec-t{flex:1;margin:0;min-width:0;font-size:var(--font-size-body);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-t a,.sec-t .lbl{display:inline-block;color:inherit;text-decoration:none}
/* filtered bento: the count becomes a fraction (matches/all); hovering it opens the Filters popover */
.b-n.frac{position:relative;z-index:2;margin:-2px -6px -2px 0;padding:2px 6px;border-radius:var(--radius-compact);cursor:pointer;pointer-events:auto}
.b-n.frac.on{background:var(--surface-control);color:var(--text-primary)}
@media (hover:hover){.b-n.frac:hover{background:var(--surface-control);color:var(--text-primary)}}
/* while the bento sorts, the fraction flashes its hover state */
.bento.busy .b-n.frac{animation:fracflash .6s ease-in-out infinite alternate}
.b-n.frac.ping{animation:fracflash .3s ease-in-out 4 alternate}
@keyframes fracflash{from{background:transparent;color:var(--text-secondary)}to{background:var(--surface-control);color:var(--text-primary)}}
.fpop{position:fixed;z-index:25;width:300px;padding:12px var(--inset-control) var(--inset-control);background:var(--surface-raised);border-radius:var(--radius-option);box-shadow:var(--shadow-raised),0 0 0 1px var(--border-subtle);animation:fade .12s}
.fpop h2{margin:0 0 var(--gap-controls);font-size:var(--font-size-body);font-weight:400;color:var(--text-primary)}
.fpop .chips{gap:6px}
/* filter in the popover: an outline pill; on hover a × slides in from the right with the Quick spring, and leaving resets instantly */
.fpill{position:relative;height:30px;padding:0 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-control);background:none;display:inline-flex;align-items:center;font-size:var(--font-size-caption);color:var(--text-primary);overflow:hidden}
.fpill .ic{width:0;height:14px;margin-left:0;opacity:0;transform:translateX(8px);flex:none}
@media (hover:hover){.fpill:hover,.fpill:focus-visible{padding-right:8px}
  .fpill:hover .ic,.fpill:focus-visible .ic{width:14px;margin-left:var(--gap-tight);opacity:1;transform:none;transition:width .3s cubic-bezier(.3,1.45,.6,1),margin .3s cubic-bezier(.3,1.45,.6,1),transform .3s cubic-bezier(.3,1.45,.6,1),opacity .15s ease-out}}
@media (hover:none){.fpill{padding-right:8px}.fpill .ic{width:14px;margin-left:var(--gap-tight);opacity:1;transform:none}}
.b-n,.fam-n{flex:none;font-size:var(--font-size-caption);color:var(--text-secondary);font-variant-numeric:tabular-nums}
.b-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-tight);aspect-ratio:1;align-content:start;transition:opacity .2s ease}
.tb2{display:block;width:100%;aspect-ratio:1;border:0;background:none;padding:12%;border-radius:var(--radius-compact)}
.tb2>svg,.tb2>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
@media (hover:hover){.tb2:hover{background:var(--surface-raised)}}
.b-msg{grid-column:1/-1;align-self:center;margin:0;text-align:center;font-size:var(--font-size-caption);color:var(--text-secondary)}
.bento.empty{background:none;border:1px dashed var(--border-subtle);cursor:default}
.bento.empty .sec-t,.bento.empty .b-n{color:var(--text-secondary)}
.bento.miss .b-grid,.bento.miss .b-h{opacity:.45}
/* sorting: the bento dims slightly and a soft shimmer passes while its count ticks down */
.bento.busy{pointer-events:none}
.bento.busy .b-grid{opacity:.55}
.bento.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,var(--surface-raised) 50%,transparent 75%);background-size:250% 100%;opacity:.55;animation:shimmer 1s linear infinite;pointer-events:none}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
/* title hover: letters step up to Medium and turn blue one after another while the title slings 4px right.
   Figma's Quick spring; leaving the hover resets instantly (transitions live only on the hover state). */
@media (hover:hover){
  .bento:not(.empty):hover .sec-t a,.bento:not(.empty):hover .sec-t .lbl{transform:translateX(4px);transition:transform .3s cubic-bezier(.3,1.45,.6,1)}
  .bento:not(.empty):hover .sec-t .ch{font-weight:500;color:var(--text-highlight);transition:font-weight .1s ease-out,color .15s ease-out;transition-delay:calc(var(--i) * 12ms)}
}
.bento:focus-visible .sec-t .ch{font-weight:500;color:var(--text-highlight)}

/* ---------- category and type pages ---------- */
.cat-h{padding:var(--gap-stack) var(--gap-tight) var(--inset-control)}
.backl{color:var(--text-secondary);font-size:var(--font-size-caption);text-decoration:none}
@media (hover:hover){.backl:hover{color:var(--text-primary)}}
.cat-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--gap-controls) 20px;margin-top:var(--gap-controls)}
.cat-t{margin:0;font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em}
.count{margin:var(--gap-controls) 0 0;font-size:var(--font-size-caption);color:var(--text-secondary)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--inset-surface) var(--gap-controls);padding:0 var(--inset-control)}
.p{display:flex;flex-direction:column;align-items:center;gap:var(--gap-stack);min-width:0;margin:0;padding:var(--gap-stack) var(--gap-stack) var(--gap-controls);border:0;background:none;border-radius:var(--radius-option);text-align:center}
.p .img{display:block;width:100%;aspect-ratio:1;padding:10%}
.p .img>svg,.p .img>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
.p .nm{font-size:var(--font-size-caption);line-height:1.3;text-wrap:balance}
@media (hover:hover){.p:hover{background:var(--surface-hover-subtle)}}
.empty{grid-column:1/-1;padding:8vh 0;text-align:center;color:var(--text-secondary)}

/* ---------- setup assistant (chat column) ---------- */
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:var(--gap-controls);padding:var(--gap-stack) var(--inset-surface) var(--inset-control) var(--gutter-page-wide)}
.qh{margin:0;font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.qsmall{margin:var(--gap-stack) 0 0;font-size:var(--font-size-body)}
.qlab,.past,.hint{margin:0;font-size:var(--font-size-caption);color:var(--text-secondary)}
.bot{margin:0;font-size:var(--font-size-body)}
.me{align-self:flex-end;max-width:85%;border:0;background:var(--surface-raised);border-radius:var(--radius-option);padding:9px 14px;font-size:var(--font-size-body);text-align:left}
button.me{cursor:pointer}
/* answer rows: no fill, inset hairlines; hover is a rounded surface-raised fill with room around the text */
.ans{display:flex;flex-direction:column;margin:var(--gap-tight) calc(var(--gap-controls) * -1) 0}
.ans button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);min-height:var(--height-row);padding:10px var(--gap-controls);border:0;border-radius:var(--radius-compact);background:none;text-align:left;font-size:var(--font-size-body);color:var(--text-primary)}
.ans button small{display:block;margin-top:2px;font-size:var(--font-size-caption);color:var(--text-secondary)}
.ans button+button::before{content:"";position:absolute;left:var(--gap-controls);right:var(--gap-controls);top:0;height:1px;background:var(--surface-control-hover)}
@media (hover:hover){.ans button:hover{background:var(--surface-raised)}.ans button:hover::before,.ans button:hover+button::before{opacity:0}}
.box{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--surface-raised);display:grid;place-items:center;flex:none}
.box .ic{width:14px;height:14px;stroke-width:2.25;visibility:hidden}
[aria-pressed="true"] .box{background:var(--action-primary);border-color:var(--action-primary);color:var(--text-on-action)}
[aria-pressed="true"] .box .ic{visibility:visible}
.ans-acts{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);margin-top:var(--gap-controls)}
.ans-acts .acts{display:flex;gap:var(--gap-tight)}
.chatcol.chat-on .ans-acts .ghost{display:none}
.tune{display:flex;flex-direction:column;gap:var(--gap-stack);padding:var(--inset-control);border:1px solid var(--border-subtle);border-radius:var(--radius-option)}
.kit{padding:var(--gap-tight) 0;border:1px solid var(--border-subtle);border-radius:var(--radius-option)}
.kit-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--gap-controls);align-items:center;width:100%;border:0;background:none;padding:6px var(--gap-controls);text-align:left;color:var(--text-primary)}
.kit-row .th{width:40px;height:40px}
.kit-row .th>svg,.kit-row .th>img{width:100%;height:100%;object-fit:contain;display:block}
.kit-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-body)}
.kit-row small{display:block;font-size:var(--font-size-caption);color:var(--text-secondary)}
.kit-row .pz,.kit-tot{font-size:var(--font-size-body);font-variant-numeric:tabular-nums}
.kit-tot{display:flex;justify-content:space-between;margin:var(--gap-tight) var(--gap-controls) 0;padding:10px 0 6px;border-top:1px solid var(--border-subtle)}
.row-acts{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
/* chat box: hidden until the visitor clicks Chat; a single 52px row with a small square send button */
.side-f{flex:none;display:flex;flex-direction:column;gap:var(--gap-stack);padding:var(--gap-stack) var(--inset-surface) 0}
.chatcol:not(.chat-on) .side-f{display:none}
.sugg{display:flex;flex-wrap:wrap;gap:var(--gap-stack)}
.chat{display:flex;align-items:center;gap:var(--gap-stack);height:52px;padding:0 var(--gap-stack) 0 var(--inset-control);border:1px solid var(--border-subtle);border-radius:var(--radius-option);background:var(--surface-raised)}
.chat input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:var(--font-size-body);color:var(--text-primary);outline:none}
.chat input::placeholder{color:var(--text-secondary)}
.send{border:0;width:var(--height-control-sm);height:var(--height-control-sm);border-radius:var(--radius-compact);background:var(--surface-control);color:var(--text-secondary);display:grid;place-items:center}
.send .ic{width:18px;height:18px}
.chat.has-text .send{background:var(--action-primary);color:var(--text-on-action)}

/* ---------- search: the header icon opens a centred panel over a frosted page ---------- */
.spal{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:56px var(--gutter-page-compact) var(--gutter-page-compact);background:var(--overlay-frost);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);animation:fade .15s}
.spanel{width:min(var(--width-search),100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-raised);border-radius:var(--radius-option);box-shadow:var(--shadow-raised),0 0 0 1px var(--border-subtle)}
.sfield{flex:none;display:flex;align-items:center;gap:var(--gap-controls);height:56px;padding:0 var(--gap-controls) 0 var(--inset-control);border-bottom:1px solid var(--border-subtle);color:var(--text-primary)}
.sfield input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:var(--font-size-body);color:var(--text-primary);outline:none}
.sfield input::placeholder{color:var(--text-secondary)}
.sfield input::-webkit-search-cancel-button{display:none}
.slist{overflow-y:auto;overscroll-behavior:contain;padding:var(--gap-stack) 0}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--gap-controls);align-items:center;width:100%;padding:var(--gap-stack) var(--inset-control);border:0;background:none;text-align:left;color:var(--text-primary)}
.srow[aria-selected="true"]{background:var(--surface-page)}
.srow .th{width:40px;height:40px;padding:4px;border-radius:var(--radius-compact);background:var(--surface-page)}
.srow[aria-selected="true"] .th{background:var(--surface-raised)}
.srow .th>svg,.srow .th>img{width:100%;height:100%;display:block;object-fit:contain}
.srow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-body)}
.srow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-caption);color:var(--text-secondary)}
.snone{margin:0;padding:var(--gap-controls) var(--inset-control);font-size:var(--font-size-caption);color:var(--text-secondary)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:var(--gutter-page-compact);background:var(--overlay-scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--surface-raised);border-radius:var(--radius-surface);padding:var(--gap-controls) var(--inset-surface) var(--inset-surface);animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{display:none}
.mhead{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:1}
.x{border:0;background:var(--surface-control);width:36px;height:36px;border-radius:var(--radius-control);display:grid;place-items:center;color:var(--text-primary)}
@media (hover:hover){.x:hover{background:var(--surface-control-hover)}}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.hero{width:min(64%,280px);aspect-ratio:1;margin:calc(var(--gap-stack) * -1) auto 6px}
.hero>svg,.hero>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.mt{margin:0;text-align:center;font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em;text-wrap:balance}
.ms{margin:var(--gap-tight) 0 0;text-align:center;font-size:var(--font-size-caption);color:var(--text-secondary)}
.price{margin:10px 0 var(--inset-control);text-align:center;font-size:var(--font-size-body);font-variant-numeric:tabular-nums}
.note{margin:0 0 var(--inset-control);font-size:var(--font-size-body)}
.note strong{color:var(--text-primary)}
dl.specs{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--border-subtle)}
dl.specs dt,dl.specs dd{margin:0;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:var(--font-size-body)}
dl.specs dt{padding-right:var(--inset-control);color:var(--text-secondary)}
dl.specs dd{text-align:right}
.range{margin:-6px 0 18px}
.range .lab{display:flex;justify-content:space-between;margin-top:6px;font-size:var(--font-size-caption);color:var(--text-secondary)}
.range .tr{position:relative;height:8px;border-radius:var(--radius-control);background:var(--surface-sunken)}
.range .tr i{position:absolute;top:0;bottom:0;border-radius:var(--radius-control);background:var(--accent)}
/* large actions in a modal: 48px rows with an arrow on the right */
.buy{display:flex;flex-direction:column;gap:var(--gap-stack)}
.buy a,.buy button,.dark-pill{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 var(--inset-control);border:0;border-radius:var(--radius-option);text-decoration:none;font-size:var(--font-size-body)}
.buy .pri,.dark-pill{background:var(--action-primary);color:var(--text-on-action)}
.dark-pill{justify-content:center}
.buy .sec{background:var(--surface-control);color:var(--text-primary)}
@media (hover:hover){.buy .sec:hover{background:var(--surface-control-hover)}}
.buy small{opacity:.7}
.disc{margin:var(--gap-controls) 0 0;text-align:center;font-size:var(--font-size-caption);color:var(--text-secondary)}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:var(--gap-controls);align-items:center;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--border-subtle);background:none;text-align:left}
.setrow .th{width:56px;height:56px}
.setrow .th>svg,.setrow .th>img{width:100%;height:100%;object-fit:contain}
.setrow .pp,.setrow button.rm{font-size:var(--font-size-caption);color:var(--text-secondary)}
.setrow button.rm{border:0;background:none}
.tot{display:flex;justify-content:space-between;padding:14px 0 var(--gap-tight)}
.slabel{font-size:var(--font-size-caption);color:var(--text-secondary)}
.toast{position:fixed;left:50%;bottom:calc(50% - 20px);z-index:30;transform:translateX(-50%);padding:10px 18px;border-radius:var(--radius-control);background:var(--action-primary);color:var(--text-on-action);font-size:var(--font-size-caption);animation:fade .2s}

/* ---------- review queue (editors only) ---------- */
.prop{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--border-subtle)}
.prop .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prop .kind{font-size:var(--font-size-caption);color:var(--accent)}
.prop .why,.prop .src a,.prop .diff s{color:var(--text-secondary)}
.prop .why,.prop .diff,.prop .src{font-size:var(--font-size-caption)}
.prop .diff{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.prop .src{display:flex;flex-wrap:wrap;gap:6px}
.prop .acts{display:flex;gap:var(--gap-stack);margin-top:var(--gap-tight)}
.allbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}

/* ---------- news: its own full-width page, no chat column and no container ---------- */
.app.newsmode{grid-template-columns:minmax(0,1fr);background:var(--surface-raised)}
.newsmode .chatcol{display:none}
.newsmode .main{grid-column:1;margin:0;border-radius:0}
.newsmode .foot{grid-column:1;justify-content:center}
.news{max-width:600px;margin:0 auto;padding:var(--gap-section) 0 56px}
.news p,.news li,.news td,.news th{text-wrap:pretty}
.news h1,.news h2,.news h3{text-wrap:pretty}
.n-title{margin:var(--gap-section) 0 var(--gap-stack);font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em;line-height:1.25}
.n-intro{margin:0 0 var(--gap-section);color:var(--text-secondary)}
.n-label{margin:0 0 var(--gap-controls);font-size:var(--font-size-caption);font-weight:var(--font-weight-label);color:var(--text-primary)}
.n-label.owner{color:var(--accent)}
.n-empty{color:var(--text-secondary);font-size:var(--font-size-caption)}
.n-list{display:flex;flex-direction:column;gap:var(--gap-stack);margin:0 calc(var(--inset-control) * -1) var(--gap-section)}
/* row: photo tile, headline, dek, then date · sources; hover fills, nothing moves */
.nrow{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--inset-control);align-items:start;padding:var(--inset-control);border-radius:var(--radius-option)}
@media (hover:hover){.nrow:hover{background:var(--surface-hover-subtle)}}
.nrow .th{width:64px;height:64px}
.nrow a.cover{color:var(--text-primary);text-decoration:none}
.nrow a.cover::after{content:"";position:absolute;inset:0;border-radius:inherit}
.nrow h3{margin:0;font-size:var(--font-size-body);font-weight:400;line-height:1.35}
.nrow .dek{margin:var(--gap-tight) 0 0;font-size:var(--font-size-caption);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .meta{position:relative;z-index:1;margin-top:var(--gap-stack)}
/* product photo tile used in rows, headers and the comparison table */
.th.tile{display:block;padding:8%;border:0;border-radius:var(--radius-option);background:var(--surface-hover-subtle)}
.th.tile>svg,.th.tile>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
button.th.tile{cursor:pointer}
.th.tile.photo{padding:0;overflow:hidden}
.photo img,.th.tile.photo>img{display:block;width:100%;height:100%;object-fit:cover;background:var(--surface-hover-subtle)}
.photo.broken img{visibility:hidden}
.afig{margin:var(--gap-section) 0}
.afig img{height:auto;max-height:420px;object-fit:contain;border-radius:var(--radius-option)}
.afig figcaption{margin-top:var(--gap-stack);font-size:var(--font-size-caption);color:var(--text-secondary);text-wrap:pretty}
@media (hover:hover){button.th.tile:hover{background:var(--surface-control)}}
/* date · Sourced from [favicons] */
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:var(--font-size-meta);color:var(--text-secondary)}
.srcbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;font-size:inherit;color:inherit;border-radius:var(--radius-compact)}
.favs{display:inline-flex;align-items:center}
.fav{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-control);color:var(--text-primary);font-size:8px;line-height:1;box-shadow:0 0 0 1.5px var(--surface-raised);flex:none}
.favs .fav+.fav{margin-left:-4px}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-raised);opacity:0}
.fav img.on{opacity:1}
@media (hover:hover){.srcbtn:hover{color:var(--text-primary)}}
/* sources: a popover on click (desktop), a full-screen sheet on phones */
.srcpop{position:fixed;z-index:25;min-width:240px;max-width:min(360px,calc(100vw - 32px));padding:6px;background:var(--surface-raised);border-radius:var(--radius-compact);box-shadow:var(--shadow-raised),0 0 0 1px var(--border-subtle);animation:fade .12s}
.srcpop .lbx-head,.srcpop .lbx-sub{display:none}
.srcrow{display:flex;align-items:center;gap:var(--gap-stack);padding:6px;border-radius:var(--radius-compact);color:var(--text-primary);text-decoration:none;font-size:var(--font-size-caption)}
.srcrow .fav{width:16px;height:16px;box-shadow:none}
.srcrow .host{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .go-ic{color:var(--text-secondary)}
@media (hover:hover){.srcrow:hover{background:var(--surface-page)}}
/* article */
.backl.n-back{display:inline-block;margin-top:var(--gap-stack)}
.ahead{display:flex;gap:20px;align-items:stretch;margin:var(--gap-section) 0}
.ahead-t{flex:1;min-width:0}
/* the photo is square and as tall as the headline, dek and meta beside it (sized in sizeHero) */
.ahead .th{flex:none;width:var(--hero,120px);height:var(--hero,120px)}
.ahead h1{margin:0;font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em;line-height:1.25}
.ahead .dek{margin:var(--gap-stack) 0 0;color:var(--text-secondary)}
.ahead .meta{margin-top:var(--gap-controls)}
.short{margin:0 0 32px;padding:var(--inset-control) 20px;border-radius:var(--radius-option);background:var(--surface-highlight)}
.short ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px}
.short li::marker{color:var(--text-secondary)}
.asec{margin:0 0 32px}
.asec p{margin:0 0 var(--gap-controls)}
.ilink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--text-secondary);text-underline-offset:3px;cursor:pointer}
@media (hover:hover){.ilink:hover{text-decoration-color:var(--text-primary)}}
.cmpwrap{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--border-subtle);border-radius:var(--radius-option)}
table.cmp{width:100%;border-collapse:collapse;table-layout:fixed}
.cmp th,.cmp td{padding:10px var(--gap-controls);text-align:center;font-size:var(--font-size-body);font-weight:400;vertical-align:middle}
.cmp thead th{padding-top:var(--inset-control);font-size:var(--font-size-caption)}
.cmp thead .th{width:56px;height:56px;margin:0 auto 6px;border-radius:var(--radius-compact)}
.cmp thead .nm{display:block;line-height:1.3}
.cmp tbody th{text-align:left;font-size:var(--font-size-caption);color:var(--text-secondary);width:108px}
.cmp tbody tr{border-top:1px solid var(--border-subtle)}
.cmp .hl{background:var(--surface-hover-subtle)}
.cmp thead .hl .nm{font-weight:var(--font-weight-label)}
.cmp thead th:first-child{width:108px}
.verdict{border-top:1px solid var(--border-subtle)}
.verdict div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--gap-controls);padding:var(--gap-controls) 0;border-bottom:1px solid var(--border-subtle)}
.verdict span{color:var(--text-primary)}
.verdict p{margin:0}
.draftbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--gap-controls);margin-top:var(--gap-section);padding:var(--gap-controls) var(--inset-control);border:1px solid var(--accent);border-radius:var(--radius-option);font-size:var(--font-size-caption)}
.draftbar .k{color:var(--accent)}
.draftbar .acts{display:flex;gap:var(--gap-stack)}
.prop .acts .pv{background:none;border:1px solid var(--border-control);color:var(--text-primary)}

/* ---------- phone ---------- */
@media (max-width:760px){
  body{overflow:auto}
  .app{position:static;display:block;height:auto}
  .top2{height:var(--height-header);padding:0 var(--gutter-page-compact)}
  .hnav{gap:var(--gap-controls)}
  .top2 .review{position:static}
  .thread{overflow:visible;padding:var(--gap-stack) var(--gutter-page-compact) var(--inset-control)}
  .side-f{padding:0 var(--gutter-page-compact) var(--inset-control)}
  .main{margin:0 var(--gap-stack);overflow:visible;border-radius:var(--radius-option)}
  .groups{padding:var(--gap-stack)}
  .bentos{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-stack)}
  .bento{padding:var(--gap-controls) var(--gap-controls) var(--gap-tight)}
  .foot{justify-content:center;padding:var(--gap-stack) var(--gutter-page-compact) calc(var(--gap-stack) + env(safe-area-inset-bottom,0px))}
  .spal{padding-top:var(--gap-stack)}
  .modal{max-width:none;max-height:92vh;border-radius:var(--radius-surface) var(--radius-surface) 0 0;padding-bottom:calc(var(--inset-surface) + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end;padding:0}
  .grab{display:block;width:38px;height:5px;margin:0 auto 6px;border-radius:var(--radius-control);background:var(--surface-sunken)}
  .news{padding:var(--gap-stack) var(--gutter-page-compact) 40px}
  .newsmode .main{margin:0}
  .n-list{margin-left:calc(var(--gap-stack) * -1);margin-right:calc(var(--gap-stack) * -1)}
  .nrow{padding:var(--gap-controls) var(--gap-stack);grid-template-columns:56px minmax(0,1fr);gap:var(--gap-controls)}
  .nrow .th{width:56px;height:56px}
  .nrow .dek{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .meta{font-size:var(--font-size-caption)}
  .fav{width:20px;height:20px;font-size:9px}
  /* article on a phone: title first, then the photo across the full width */
  .ahead{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .ahead .ahead-t{order:1}
  .ahead .th{order:2;width:auto;height:auto;aspect-ratio:4/3;margin:var(--gap-section) calc(var(--gutter-page-compact) * -1) 0;border-radius:0;padding:var(--gap-section)}
  .ahead .th.photo{padding:0}
  .cmpwrap{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
  .cmpwrap.end{-webkit-mask-image:none;mask-image:none}
  table.cmp{width:520px}
  .srcpop{inset:0;max-width:none;min-width:0;border-radius:0;padding:var(--gap-controls) var(--gutter-page-compact) var(--inset-surface);box-shadow:none;overflow-y:auto}
  .srcpop .lbx-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--gap-stack)}
  .srcpop .lbx-head h2{margin:0;font-size:var(--font-size-heading);font-weight:300;letter-spacing:-.02em}
  .srcpop .lbx-sub{display:block;margin:0 0 var(--gap-stack);font-size:var(--font-size-caption);color:var(--text-secondary)}
  .srcrow{min-height:52px;padding:var(--gap-controls) 0;border-radius:0;border-bottom:1px solid var(--border-subtle);font-size:var(--font-size-body)}
  .srcrow .fav{width:24px;height:24px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top2">
    <div class="hnav">
      <a class="logo" href="#" aria-label="Catalog Cafe home">Catalog Cafe</a>
      <nav class="navs" aria-label="Site"><button class="navl" id="aboutNav">About</button><a class="navl" href="#news">News</a><button class="icon-btn" id="searchBtn" aria-label="Search all products" aria-haspopup="dialog"></button></nav>
    </div>
    <button class="review" id="reviewBtn" hidden></button>
  </header>
  <aside class="chatcol" id="side" aria-label="Find your setup">
    <div class="thread" id="thread"></div>
    <div class="side-f">
      <div class="sugg" id="sugg" hidden></div>
      <form class="chat" id="chat"><input id="chatIn" type="text" placeholder="Tell me what you need…" aria-label="Tell the setup assistant what you need" autocomplete="off"><button class="send" aria-label="Send"></button></form>
    </div>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
  <footer class="foot">
    <button id="aboutBtn">About and affiliate disclosure</button><button id="signBtn">Sign in</button>
    <span>Bean data from <a href="https://www.loffeelabs.com/" target="_blank" rel="noopener">Loffee Labs</a></span>
  </footer>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* ---------- affiliate config: replace with your real tags ---------- */
const AFFILIATE={amazonTag:'YOURTAG-20'};

/* ---------- catalog: live from the artifact database (prices stored in USD) ---------- */
let GEAR=[];            // merged view of gear + beans, active items only
let RAW={gear:[],beans:[]};
let FX={USD:1};
let LOAD='loading';     // loading | ready | offline | stale
let PENDING=[];         // proposals awaiting review (editors only)
let isEditor=false, SB=null, SESSION=null;

const ICON={
  grinders:'<path d="M9 10h6v10H9z"/><path d="M8 10h8"/><path d="M12 10V4h6"/><circle cx="18.5" cy="4" r="1.5"/>',
  espresso:'<rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9 9h6"/><path d="M10 16v2.5h4V16"/><path d="M3 20.5h18"/>',
  brewers:'<path d="M4.5 6h15l-5 9h-5z"/><path d="M7 19.5h10"/><path d="M12 15v4.5"/>',
  kettles:'<path d="M7 20v-7a5 5 0 0 1 10 0v7z"/><path d="M7 15c-3 0-3.5-5-5-7"/><path d="M17 12h1.5a2 2 0 0 1 0 4H17"/><path d="M12 8V6.5"/>',
  scales:'<path d="M3 14h18l1.5 5h-21z"/><path d="M10 16.5h4"/>',
  beans:'<ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(30 12 12)"/><path d="M8.5 5.5c3 3 .5 9 6.5 13"/>'
};
const CURS={USD:'US dollar',CAD:'Canadian dollar',EUR:'Euro',GBP:'British pound',AUD:'Australian dollar'};
const cur=()=>FX[S.cur]?S.cur:'USD';
function money(usd){
  const c=cur(), v=usd*(FX[c]||1);
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}catch(e){return '$'+Math.round(v)}
}
function nice(usd){const v=usd*(FX[cur()]||1), st=v>=100?10:5;return Math.round(v/st)*st/(FX[cur()]||1)}
const under=n=>()=>`Under ${money(nice(n))}`, span=(a,b)=>()=>`${money(nice(a))}–${money(nice(b))}`, over=n=>()=>`${money(nice(n))}+`;
const B=(lo,hi)=>g=>g.price>=lo&&g.price<hi;
/* ---------- icons (rounded outline, 24 px grid) ---------- */
const ICONS={
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/>',
  x:'<path d="M7 7l10 10M17 7 7 17"/>',
  send:'<path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"/>',
  right:'<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>',
  sideClose:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15"/><path d="m8 9.5 2.5 2.5L8 14.5"/>',
  check:'<path d="m6 12.5 4 4 8-9"/>'
};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

/* ---------- product types and their filters ----------
   Filters inside a group are alternatives (Hand or Electric); groups combine (Electric and Espresso). */
const CATS=[
 {key:'espresso',label:'Espresso machines',short:'machines',cats:['espresso'],groups:[
   [['semi','Semi-automatic',g=>g.effort!==3&&g.kind!=='super'],['super','Super-automatic',g=>g.kind==='super'],['lever','Manual and lever',g=>g.effort===3]],
   [['easy','Easy to use',g=>g.kind==='super'||g.effort===1||!!g.builtIn]],
   [['milk','Steam wand',g=>!!g.milk]],[['grinder','Built-in grinder',g=>!!g.builtIn]],[['compact','Compact',g=>g.w===1]]]},
 {key:'grinders',label:'Grinders',short:'grinders',cats:['grinder'],groups:[
   [['hand','Hand',g=>g.kind==='hand'],['electric','Electric',g=>g.kind!=='hand']],
   [['espresso','Espresso',g=>(g.does||[]).includes('espresso')],['filter','Filter',g=>(g.does||[]).includes('filter')]],
   [['single','Single dose',g=>g.kind!=='hand'&&g.kind!=='hopper'],['hopper','Hopper',g=>g.kind==='hopper']]]},
 {key:'brewers',label:'Coffee makers',short:'coffee makers',cats:['brewer'],groups:[
   [['pourover','Pour-over',g=>['cone','chemex'].includes(g.kind)],['immersion','Immersion',g=>['steep','aeropress'].includes(g.kind)],
    ['press','French press',g=>g.kind==='press'],['moka','Moka pot',g=>g.kind==='moka'],['machine','Drip machine',g=>!['cone','chemex','steep','aeropress','press','moka','cold'].includes(g.kind)],['cold','Cold brew',g=>g.kind==='cold']]]},
 {key:'kettles',label:'Kettles and scales',short:'kettles and scales',cats:['kettle','scale'],groups:[
   [['kettle','Kettles',g=>g.cat==='kettle'],['scale','Scales',g=>g.cat==='scale']],
   [['electric','Electric',g=>g.cat==='kettle'&&!!g.electric],['stove','Stovetop',g=>g.cat==='kettle'&&!g.electric]],
   [['timer','With timer',g=>g.cat==='scale'&&!!g.timer]]]},
 {key:'beans',label:'Beans',short:'beans',cats:['bean'],groups:[
   [['light','Light roast',g=>g.roast==='light'],['medium','Medium roast',g=>g.roast==='medium'],['dark','Dark roast',g=>g.roast==='dark']],
   [['forEsp','For espresso',g=>g.for!=='filter'],['forFil','For filter',g=>g.for!=='espresso']],
   [['fruity','Fruity',g=>g.flavor==='fruity'],['choc','Chocolatey',g=>g.flavor==='choc'],['sweet','Sweet',g=>g.flavor==='sweet']]]}
];
const CAT_ONE={espresso:'Espresso machine',grinder:'Grinder',brewer:'Coffee maker',kettle:'Kettle',scale:'Scale',bean:'Coffee beans'};
const catOf=it=>CATS.find(c=>c.cats.includes(it.cat))||CATS[0];

/* ---------- state ---------- */
let S={view:'home',filters:{},setup:[],cur:'USD',side:true,chat:{}};
try{const old=JSON.parse(localStorage.getItem('bf2')||'null');if(old){S.setup=old.setup||[];S.cur=old.cur||'USD'}}catch(e){}
try{const s=JSON.parse(localStorage.getItem('cc3')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('cc3',JSON.stringify(S))}catch(e){}};
const byId=id=>GEAR.find(g=>g.id===id);
const phoneMQ=matchMedia('(max-width:760px)');

function sub(it){
  switch(it.cat){
    case 'grinder':return `${it.kind==='hand'?'Hand':'Electric'} · ${it.burr||''}`;
    case 'espresso':return (it.heat||'').split(',')[0];
    case 'brewer':return it.method;
    case 'kettle':return it.electric?'Electric':'Stovetop';
    case 'scale':return (it.spec||'').split(',').slice(0,2).join(',');
    case 'bean':return [it.roaster,it.origin].filter(Boolean).join(' · ');
  }
}


/* ---------- images: real photo when the catalog has one, drawing otherwise ---------- */
function pic(it){
  const src=typeof it.img==='string'&&/^(\/|https:\/\/|blob:|data:image\/)/.test(it.img)?it.img:null;
  return src?`<img src="${esc(src)}" alt="" loading="lazy" draggable="false">`:art(it);
}
const byPop=(a,b)=>(a.pop||99)-(b.pop||99);

/* ---------- routing: #grinders opens a category, anything else is home ---------- */
const app=document.getElementById('app'), main=document.getElementById('main');
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==='owner'){openSignIn();return}
  const LEGACY={espresso:'espresso-machines',brewers:'coffee-makers',kettles:'brewing-tools',scales:'brewing-tools',beans:'coffee-beans'};
  const [a,b]=h.split('/'), fam=GROUPS.find(f=>f.slug===(LEGACY[a]||a));
  S.fam=null;S.type=null;
  if(fam&&b){const t=fam.items.find(x=>x.id===b&&!x.empty);if(t){S.view=t.k;S.fam=fam.slug;S.type=t.id;S.filters[t.k]=[...t.f]}else{S.view='fam';S.fam=fam.slug}}
  else if(fam){S.view='fam';S.fam=fam.slug}
  else if(a==='news'){S.view='news';S.post=b||null}
  else S.view='home';
  save();closeModal();renderMain(true);
}
addEventListener('hashchange',route);
function go(key,filters){
  if(filters)S.filters[key]=filters;

/* ---------- news: published posts are public; drafts wait in the review queue for the owner ---------- */
let NEWS=[], NEWS_LOAD='loading';
const NEWS_INTRO='Short, sourced notes on new coffee gear, compared with what’s already in the catalog.';
async function loadNews(){
  if(!SB){NEWS_LOAD='offline';return}
  try{const {data,error}=await SB.from('news').select('id,doc,published_at').order('published_at',{ascending:false});
    if(error)throw error;NEWS=data.map(r=>({id:r.id,...r.doc,date:r.published_at}));NEWS_LOAD='ready'}
  catch(e){NEWS_LOAD='offline'}
  if(S.view==='news')renderMain(false);
}
const drafts=()=>isEditor?PENDING.filter(p=>p.collection==='news').map(p=>({...(p.data||{}),id:p.doc_id,sources:p.sources||[],draft:true,pid:p.id,date:p.created_at})):[];
const postById=id=>NEWS.find(n=>n.id===id)||drafts().find(n=>n.id===id);
const fmtDate=d=>{try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return ''}};
// keep the last two words together so a line never ends with one word on its own
const keepLast=t=>{const s=String(t??'').trim(), i=s.lastIndexOf(' ');return i>0&&s.split(' ').length>3?s.slice(0,i)+' '+s.slice(i+1):s};
// [[catalog-id|label]] becomes a dotted-underline link to the product when it is in the catalog
function inline(t){
  return esc(keepLast(t)).replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g,(m,id,label)=>byId(id)?`<button class="ilink" data-open="${id}">${label}</button>`:label);
}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function favHtml(u){const h=hostOf(u);return `<span class="fav" aria-hidden="true">${esc((h[0]||'?').toUpperCase())}<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" alt="" loading="lazy" onload="this.naturalWidth>16&&this.classList.add('on')" onerror="this.remove()"></span>`}
function srcList(post){const seen=new Set();return (post.sources||[]).map(x=>({...x,u:safeUrl(x.url)})).filter(x=>x.u&&!seen.has(hostOf(x.u))&&seen.add(hostOf(x.u)))}
function metaHtml(post){
  const src=srcList(post);
  return `<div class="meta"><span>${post.draft?'Draft · ':''}${esc(fmtDate(post.date))}</span>${src.length?`<span aria-hidden="true">·</span><button class="srcbtn" data-src="${esc(post.id)}" aria-haspopup="dialog">Sourced from <span class="favs">${src.slice(0,4).map(x=>favHtml(x.u)).join('')}</span></button>`:''}</div>`;
}
// product picture: the catalog photo (and a link to it) when the product is live, a drawing otherwise
function tileHtml(x,cls=''){
  const it=x&&x.catalog_id&&byId(x.catalog_id);
  if(it)return `<button class="th tile ${cls}" data-open="${esc(it.id)}" aria-label="${esc(it.name)}">${pic(it)}</button>`;
  const spec=x&&x.art?{...x.art,name:x.name||''}:null;
  return `<span class="th tile ${cls}">${spec?art(spec):''}</span>`;
}

function drawBento(idx,animate){

 [/\bsingle[- ]?dos(e|ing)\b/,'Single dose',g=>g.cat==='grinder'?(g.kind!=='hand'&&g.kind!=='hopper'):null],
 [/\b(compact|small|tiny)\b/,'Compact',g=>g.cat==='espresso'?g.w===1:null],
 [/\b(easy|simple|automatic)\b/,'Easy to use',g=>g.cat==='espresso'?(g.kind==='super'||g.effort===1||!!g.builtIn):null],
 [/\b(gooseneck|stovetop)\b/,'Gooseneck',g=>g.cat==='kettle'?true:null],

 [/\bsweet\b/,'Sweet',g=>g.cat==='bean'?g.flavor==='sweet':null]];
const CHEAP={espresso:500,grinder:200,brewer:50,kettle:100,scale:60,bean:20};
function parseQuery(text){
  let t=' '+text.toLowerCase().replace(/[’']/g,"'")+' ';
  const q={chips:[],cats:new Set(),rules:[],max:null,words:[]};
  let m=t.match(/(?:under|below|less than|max|up to|<)\s*\$?\s*(\d[\d,]*)/)||t.match(/\$\s*(\d[\d,]*)/);
  if(m){q.max=Number(m[1].replace(/,/g,''));q.chips.push('Under '+money(nice(q.max)));t=t.replace(m[0],' ')}
  if(/\b(cheap|budget|affordable|inexpensive)\b/.test(t)){q.cheap=true;q.chips.push('Budget');t=t.replace(/\b(cheap|budget|affordable|inexpensive)\b/g,' ')}
  for(const [re,label,fn] of KW)if(re.test(t)){q.rules.push(fn);q.chips.push(label);t=t.replace(new RegExp(re.source,'g'),' ')}
  for(const [re,label,cat] of CAT_WORDS)if(re.test(t)){q.cats.add(cat);q.chips.push(label);t=t.replace(new RegExp(re.source,'g'),' ')}
  // anything left: brand, product, roaster or origin names, kept only if something in the catalog has them
  q.words=t.split(/[^a-z0-9\-]+/).filter(w=>w.length>2&&!STOP.has(w)&&GEAR.some(g=>hay(g).includes(w)));
  q.words.forEach(w=>q.chips.push('“'+w+'”'));
  return q.chips.length?q:null;
}
const hay=g=>(g._hay||(g._hay=[g.name,g.brand,g.roaster,g.origin].join(' ').toLowerCase()));
function matchQuery(q,g){
  if(q.cats.size&&!q.cats.has(g.cat))return false;
  for(const r of q.rules){if(r(g)!==true)return false}
  if(q.max!=null&&(g.price||0)>q.max)return false;
  if(q.cheap&&(g.price||0)>(CHEAP[g.cat]||1e9))return false;
  for(const w of q.words)if(!hay(g).includes(w))return false;
  return true;
}
let qTimer=null;
function setQuery(text){
  const q=text.trim()?parseQuery(text):null;
  if(JSON.stringify(q&&q.chips)===JSON.stringify(QUERY&&QUERY.chips))return;
  QUERY=q;
  if(S.view!=='home'&&S.view!=='fam'&&q)location.hash='';else drawAll(true);
  renderSide();
}
function chipsHtml(c,sel){

  const chip=(id,label,p)=>`<button class="chip" data-chip="${id}" aria-pressed="${p}">${label}${p&&id!=='popular'?ico('x'):''}</button>`;
  return (sel.length?'':chip('popular','Popular',true))+on.map(o=>chip(o[0],o[1],true)).join('')+(sel.length?chip('popular','Popular',false):'')+off.map(o=>chip(o[0],o[1],false)).join('');
}

    ${(LOAD==='ready'||LOAD==='stale')&&!(c.key==='beans'&&BEANS_LOADING)?`<p class="count">${list.length.toLocaleString('en-US')} ${list.length===1?'product':'products'}</p>`:''}</div>

const STEPS={
  drinks:{q:'What drinks do you plan on making?',sub:'Pick all that apply',multi:true,
    o:[['espresso','Espresso'],['milk','Lattes & cappuccinos'],['americano','Americano'],['filter','Pour-over or drip'],['unsure','Not sure']]},
  hands:{q:'How hands-on do you want to be?',o:[['lever','Manual lever','Pull every shot by hand'],['semi','Semi-automatic','You start and stop the shot'],['guided','Let the machine help','Built-in grinder or automatic milk']]},
  brew:{q:'How do you like to brew?',o:[['pourover','Pour-over'],['immersion','Immersion, like an AeroPress'],['press','French press'],['machine','Drip machine']]},
  kit:{q:'Do you have a gooseneck kettle and a scale?',o:[['have','Yes, both'],['add','Add them to my setup']]},
  grinder:{q:'Do you already have a grinder?',o:[['yes','Yes'],['no','No, help me pick one']]},
  gtype:{tune:'Fine-tune grinders',q:'What kind of grinder?',hint:'Your choice adds a filter to the grinders on the left.',
    o:[['single','Single dose','Weigh beans for each shot'],['hopper','Hopper','Fill it up, grind on demand'],['hand','Hand grinder','Quiet and portable'],['any','Not sure','Show me all of them']]},
  budget:{q:'What do you want to spend in total?',o:[['lo',()=>`Under ${money(nice(300))}`],['mid',()=>`${money(nice(300))} to ${money(nice(800))}`],['hi',()=>`${money(nice(800))} and up`],['any','Show me everything']]}

const A=()=>S.chat;
const wantsEsp=a=>a.easy||(a.drinks||[]).some(d=>d!=='filter');
const wantsFil=a=>!a.easy&&(a.drinks||[]).includes('filter');
function order(a){
  const s=['drinks'];if(!a.drinks&&!a.easy)return s;
  if(wantsEsp(a)&&!a.easy)s.push('hands');
  if(wantsFil(a)){s.push('brew');if(a.brew&&a.brew!=='machine')s.push('kit')}
  if(!a.easy){s.push('grinder');if(a.grinder==='no')s.push('gtype')}

}
const optLabel=o=>typeof o[1]==='function'?o[1]():o[1];
function answerText(k,a){
  if(k==='drinks')return a.easy?'Not sure':STEPS.drinks.o.filter(o=>a.drinks.includes(o[0])).map(o=>o[1]).join(', ');
  const o=STEPS[k].o.find(x=>x[0]===a[k]);return o?optLabel(o):'';
}
let picks=new Set();   // drinks ticked but not yet confirmed
function grinderFilters(a){
  const f=[wantsEsp(a)?'espresso':'filter'];
  if(a.gtype==='single')f.push('single');else if(a.gtype==='hopper')f.push('hopper');else if(a.gtype==='hand')f.push('hand');

}
function answer(k,v){
  const a=A(), steps=order(a);
  steps.slice(steps.indexOf(k)).forEach(s=>{delete a[s];if(s==='drinks')delete a.easy});
  if(k==='drinks'&&v==='easy')a.easy=true;else a[k]=v;

}
function undoTo(k){const a=A(),steps=order(a);steps.slice(steps.indexOf(k)).forEach(s=>{delete a[s];if(s==='drinks')delete a.easy});picks=new Set();save();applyChat();renderSide()}

function chatFilters(a){
  const f={}, d=a.drinks||[];
  if(a.easy)f.espresso=['easy'];else{const e=[];if(a.hands)e.push(a.hands==='guided'?'easy':a.hands);if(d.includes('milk'))e.push('milk');if(e.length)f.espresso=e}

}
const CHAT_CATS=['espresso','brewers','grinders','beans'];

function applyChat(){
  const f=chatFilters(A()), touched=[];
  CHAT_CATS.forEach(k=>{const was=JSON.stringify(lastChat[k]||[]),now=JSON.stringify(f[k]||[]);if(was!==now){S.filters[k]=f[k]||[];touched.push(k)}});
  lastChat=f;S.chatFilters=f;save();refreshFilters(touched);

// a suggested setup that fits the answers and the budget
function suggest(a){
  const cap={lo:300,mid:800,hi:1e9,any:1e9}[a.budget]||1e9;
  const need=[];
  const pool=(cat,f)=>GEAR.filter(g=>g.cat===cat&&f(g)).sort(byPop).slice(0,12);
  if(wantsEsp(a)){const e=a.easy?g=>g.effort===1:CATS[0].groups[0].find(o=>o[0]===a.hands)?.[2]||(g=>true);
    need.push(pool('espresso',g=>e(g)&&(!(a.drinks||[]).includes('milk')||g.milk)))}
  if(wantsFil(a)){const b=CATS[2].groups[0].find(o=>o[0]===a.brew);need.push(pool('brewer',b?b[2]:g=>true))}
  if(a.grinder==='no'){const f=grinderFilters(a), c=CATS[1];need.push(pool('grinder',g=>c.groups.every(gr=>{const on=gr.filter(o=>f.includes(o[0]));return !on.length||on.some(o=>o[2](g))})))}
  if(a.kit==='add'){need.push(pool('kettle',g=>true));need.push(pool('scale',g=>g.use!=='espresso'))}
  need.push(pool('bean',g=>wantsEsp(a)?g.for!=='filter':g.for!=='espresso'));
  const lists=need.filter(l=>l.length), pick=lists.map(()=>0);
  const total=()=>lists.reduce((s,l,i)=>s+(l[pick[i]].price||0),0);
  for(let n=0;n<80&&total()>cap;n++){
    // swap the priciest pick for a cheaper option in the same list
    let best=-1,gain=0;
    lists.forEach((l,i)=>{const cur=l[pick[i]].price||0;const j=l.findIndex(x=>(x.price||0)<cur);if(j>=0&&cur-(l[j].price||0)>gain){best=i;gain=cur-(l[j].price||0)}});
    if(best<0)break;const l=lists[best], cur=l[pick[best]].price||0;pick[best]=l.findIndex(x=>(x.price||0)<cur);
  }
  return {items:lists.map((l,i)=>l[pick[i]]),fits:total()<=cap};
}
function kitHtml(list,showTotal=true){

}
const thread=document.getElementById('thread'), sugg=document.getElementById('sugg');
function stepHtml(k,a){

  if(k==='drinks')return `<h3 class="qh">Browse coffee essentials or plan your café setup</h3><p class="qsmall">${st.q}</p>

  const opts=`<div class="ans">${st.o.map(o=>`<button data-ans="${k}" data-v="${o[0]}"><span>${optLabel(o)}${o[2]?`<small>${o[2]}</small>`:''}</span></button>`).join('')}</div>`;

function renderSide(){

  if(document.getElementById('spal'))return;
  const el=document.createElement('div');el.className='spal';el.id='spal';
  el.innerHTML=`<div class="spanel" role="dialog" aria-modal="true" aria-label="Search all products">
    <div class="sfield">${ico('search')}<input id="sq" type="search" placeholder="Search all products" aria-label="Search all products" autocomplete="off" role="combobox" aria-controls="slist" aria-expanded="true"><button class="icon-btn sm" id="sx" aria-label="Close search">${ico('x')}</button></div>
    <div class="slist" id="slist" role="listbox"></div></div>`;
  document.body.appendChild(el);
  const inp=document.getElementById('sq');
  inp.addEventListener('input',drawSearch);
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();moveSearch(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSearch(-1)}
    else if(e.key==='Enter'&&sHits[sAt]){e.preventDefault();const id=sHits[sAt].id;closeSearch();openProduct(id)}
  });
  el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();closeSearch()}});
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('#sx')){closeSearch();return}
    const r=e.target.closest('[data-open]');if(r){closeSearch();openProduct(r.dataset.open)}
  });
  el.addEventListener('mousemove',e=>{const r=e.target.closest('.srow');if(!r)return;const i=+r.id.slice(2);if(i!==sAt)moveSearch(i-sAt)});
  drawSearch();inp.focus();
}

/* ---------- modals ---------- */
const layer=document.getElementById('layer');
let lastFocus=null;
function openModal(html,cls){
  lastFocus=document.activeElement;
  layer.innerHTML=`<div class="scrim" id="scrim"><div class="modal ${cls||''}" role="dialog" aria-modal="true"><div class="grab"></div><div class="mhead"><button class="x" id="mx" aria-label="Close"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>${html}</div></div>`;
  document.getElementById('mx').focus();
  document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
  document.getElementById('mx').onclick=closeModal;
}
function closeModal(){layer.innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)closeModal()});
function specs(it){
  const r=({bean:()=>[['Roaster',it.roaster||'—'],['Origin',it.origin||'—'],['Process',it.process||'—'],['Variety',it.variety||'—'],['Roast',it.degree||it.roast||'—'],['Tasting notes',(it.notes||[]).join(', ')||'—'],['Bag',it.size_g?`${it.size_g} g · ${money(it.price/it.size_g*100)} per 100 g`:'—']],
    grinder:()=>[['Type',it.kind==='hand'?'Hand grinder':it.kind==='hopper'?'Electric, hopper':'Electric, single dose'],['Burrs',it.burr],['Grinds for',(it.does||[]).join(' and ')]],
    espresso:()=>[['Heating',it.heat],['Steam wand',it.milk?(it.auto?'Yes, automatic':'Yes'):'No'],['Grinder',it.builtIn?'Built in':'Buy separately'],['Footprint',['','Compact','Medium','Large'][it.w]]],
    brewer:()=>[['Method',it.method],['Makes',`Up to ${it.cap} cup${it.cap>1?'s':''}`],['You also need',it.needs]],
    kettle:()=>[['Heat',it.electric?'Electric base':'Stovetop'],['Temperature control',it.temp?'Yes':'No'],['Spout','Gooseneck']],
    scale:()=>[['Features',it.spec],['Best for',{both:'Espresso and pour-over',espresso:'Espresso',pourover:'Pour-over'}[it.use]]]})[it.cat]();
  return `<dl class="specs">${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buyLinks(it,q){
  const own=(it.links||[]).map(l=>({label:l.label,url:safeUrl(l.url)})).filter(l=>l.url&&l.label).slice(0,3);
  if(own.length)return own.map((l,i)=>`<a class="${i?'sec':'pri'}" href="${esc(l.url)}" target="_blank" rel="noopener sponsored">${esc(l.label)} <small>↗</small></a>`).join('');
  return `<a class="pri" href="https://www.amazon.com/s?k=${q}&tag=${AFFILIATE.amazonTag}" target="_blank" rel="noopener sponsored">Buy on Amazon <small>↗</small></a>
      <a class="sec" href="https://www.google.com/search?tbm=shop&q=${q}" target="_blank" rel="noopener">Compare other shops <small>↗</small></a>`;
}
async function openProduct(id){
  await fullBean(id);
  const it=byId(id), q=encodeURIComponent(it.name), inSetup=S.setup.includes(id);
  const rng=it.cat==='grinder'?(()=>{const d=it.does||[];const e=d.includes('espresso'),f=d.includes('filter');const [a,b]=e&&f?[4,96]:e?[4,44]:[30,96];
    return `<div class="range"><div class="tr" role="img" aria-label="Grind range"><i style="left:${a}%;width:${b-a}%"></i></div><div class="lab"><span>Espresso</span><span>Moka</span><span>Pour-over</span><span>Press</span></div></div>`})():'';
  openModal(`<div class="hero">${pic(it)}</div>
    <h2 class="mt">${esc(it.name)}</h2><p class="ms">${esc(sub(it))}</p>
    <p class="price">About ${money(it.price||0)}${it.cat==='bean'&&it.size_g?` · ${it.size_g} g`:''}</p>
    <p class="note">${esc(it.note)}</p>${specs(it)}${rng}${it.updated_at?`<p class="disc" style="margin:-8px 0 14px">Checked ${new Date(it.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</p>`:''}${it.source==='loffee'?'<p class="disc" style="margin:-8px 0 14px">Bean data from Loffee Labs</p>':''}
    <div class="buy">
      ${buyLinks(it,q)}
      <button class="sec" id="toggleSetup">${inSetup?'Remove from my setup':'Add to my setup'} <small>${inSetup?'−':'+'}</small></button>
    </div>
    <p class="disc">Prices are approximate. We may earn a commission when you buy through these links.</p>`);
  document.getElementById('toggleSetup').onclick=()=>{
    if(S.setup.includes(id)){S.setup=S.setup.filter(x=>x!==id);toast('Removed from your setup')}else{S.setup.push(id);toast('Added to your setup')}
    save();renderSetup();closeModal();
  };
}
function openSetup(){
  const items=S.setup.map(byId).filter(Boolean), total=items.reduce((a,b)=>a+b.price,0);
  openModal(`<h2 class="mt">My setup</h2><p class="ms">${items.length?`${items.length} item${items.length>1?'s':''}`:'Nothing here yet'}</p>
    ${items.length?`<div class="setlist" style="margin-top:14px">${items.map(it=>`<div class="setrow"><div class="th">${pic(it)}</div><div style="min-width:0"><div class="nm2">${esc(it.name)}</div><div class="pp">${sub(it)} · ${money(it.price)}</div></div><button class="rm" data-rm="${it.id}">Remove</button></div>`).join('')}</div>
    <div class="tot">Total <span>${money(total)}</span></div>`:`<p class="note" style="text-align:center;margin-top:16px">Tap any product and choose “Add to my setup” to build a full kit here.</p>`}`);
  layer.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.setup=S.setup.filter(x=>x!==b.dataset.rm);save();renderSetup();openSetup()});
}

/* ---------- boot ---------- */
function renderCur(){}

function mergeCatalog(){
  const live=x=>x.status!=='discontinued';
  GEAR=[...RAW.gear.filter(live),...RAW.beans.filter(live).map(b=>({...b,cat:'bean'}))];
}
async function boot(){
  const cfg=window.CATALOG_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){LOAD='offline';renderAll(true);return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  loadNews();
  await loadCatalog(true);
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;setTimeout(checkAdmin,0)});
  const {data}=await SB.auth.getSession();SESSION=data.session;checkAdmin();
  if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
  if(location.hash==='#owner'&&!SESSION)openSignIn();
}
/* Loading, fastest first: gear (small) draws the page right away, beans follow.
   Beans come without their long fields (description, notes, links); a product popup fetches those.
   The last catalog is kept on this device so a return visit draws immediately, then refreshes. */
const BEAN_FIELDS='id,name:doc->>name,roaster:doc->>roaster,origin:doc->>origin,roast:doc->>roast,for:doc->>for,flavor:doc->>flavor,degree:doc->>degree,price:doc->price,size_g:doc->size_g,img:doc->>img,pop:doc->pop,status:doc->>status,source:doc->>source';
const CACHE_KEY='cc-catalog-1';
let BEANS_LOADING=true;
const asItem=r=>r.doc?{id:r.id,...r.doc}:{...r};
async function rows(table,cols,count){
  // pages of 1,000 fetched side by side
  if(!count){const out=[];for(let f=0;;f+=1000){const r=await SB.from(table).select(cols).order('id').range(f,f+999);if(r.error)return r;out.push(...r.data);if(r.data.length<1000)return {data:out}}}
  const pages=await Promise.all(Array.from({length:Math.ceil(count/1000)},(_,i)=>SB.from(table).select(cols).order('id').range(i*1000,i*1000+999)));
  const bad=pages.find(r=>r.error);return bad||{data:pages.flatMap(r=>r.data)};
}
async function countOf(table){try{const r=await SB.from(table).select('id',{count:'exact',head:true});return typeof r.count==='number'?r.count:0}catch(e){return 0}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.gear&&c.beans){RAW.gear=c.gear;RAW.beans=c.beans;if(c.fx)FX=c.fx;mergeCatalog();LOAD='stale';BEANS_LOADING=false;return true}}catch(e){}return false}
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),gear:RAW.gear,beans:RAW.beans,fx:FX}))}catch(e){}}
function redraw(first){if(first)renderAll(true);else{renderMain(false);renderSide()}}
async function loadCatalog(first){
  const cached=first&&readCache();
  if(cached)redraw(true);
  try{
    const beansP=countOf('beans').then(n=>rows('beans',BEAN_FIELDS,n));   // starts now, alongside gear
    const [g,m]=await Promise.all([rows('gear','id,doc'),SB.from('meta').select('id,doc').eq('id','fx').maybeSingle()]);
    if(g.error)throw g.error;
    RAW.gear=g.data.map(asItem);
    if(m.data&&m.data.doc&&m.data.doc.rates)FX={USD:1,...m.data.doc.rates};
    mergeCatalog();LOAD='ready';
    if(!cached)redraw(first);
    const b=await beansP;
    if(b.error)throw b.error;
    const full=new Map(RAW.beans.filter(x=>x._full).map(x=>[x.id,x]));
    RAW.beans=b.data.map(asItem).map(x=>full.get(x.id)||x);
    BEANS_LOADING=false;mergeCatalog();writeCache();
  }catch(e){LOAD=GEAR.length?'stale':'offline';BEANS_LOADING=false}
  redraw(first&&!cached&&LOAD==='offline');
}
async function fullBean(id){
  const it=byId(id);if(!it||it.cat!=='bean'||it._full||!SB)return;
  try{const {data}=await SB.from('beans').select('id,doc').eq('id',id).maybeSingle();
    if(data&&data.id===id){const x={...asItem(data),_full:true};const i=RAW.beans.findIndex(b=>b.id===id);if(i>=0)RAW.beans[i]=x;mergeCatalog()}}catch(e){}
}
async function checkAdmin(){
  isEditor=false;renderSign();
  if(SESSION){const {data}=await SB.rpc('is_admin');isEditor=data===true}
  if(isEditor)await loadPending();else{PENDING=[];updateReviewBtn();if(S.view==='news')renderMain(false)}
}
async function loadPending(){
  const {data}=await SB.from('proposals').select('id,doc,created_at').eq('status','pending').order('created_at');
  PENDING=(data||[]).map(r=>({...r.doc,id:r.id,created_at:r.created_at}));updateReviewBtn();
  if(layer.querySelector('#reviewList'))openReview();
  if(S.view==='news')renderMain(false);
}
function updateReviewBtn(){const rb=document.getElementById('reviewBtn');rb.hidden=!PENDING.length;rb.textContent=`Review ${PENDING.length}`}

  openModal(`<h2 class="mt">Owner sign in</h2><p class="ms">We’ll email you a one-time sign-in link.</p>
    <form id="signin" style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
      <label class="slabel" for="semail">Email</label>
      <input class="sinput" id="semail" type="email" autocomplete="email" required>
      <button class="dark-pill" type="submit" style="margin-top:8px">Email me a sign-in link</button>
      <p class="ms" id="smsg" aria-live="polite" style="text-align:left"></p></form>`);
  const f=document.getElementById('signin'), msg=document.getElementById('smsg');

    btn.disabled=false;

function openAbout(){

    <p>Catalog Cafe helps you build a coffee setup. Answer a few questions and it narrows the catalog to the grinders, espresso machines, brewers, kettles, scales and beans that fit how you drink coffee.</p>

    <p>Prices are approximate and checked regularly, but always confirm the current price with the retailer before buying.</p></div>`);
}

/* ---------- review queue (editors only) ---------- */
const KIND={add:'New',update:'Update',discontinue:'Discontinue'};
function fmtVal(k,v){if(k==='price')return money(Number(v)||0);if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.label||x.title||''):x).join(', ');if(v&&typeof v==='object')return JSON.stringify(v);return String(v)}
function propHtml(p){
  if(p.collection==='news'){
    const d=p.data||{}, src=(p.sources||[]).map(x=>({t:x.title||x.url,u:safeUrl(x.url)})).filter(x=>x.u).slice(0,4);
    return `<div class="prop"><div class="top"><span class="what">${esc(d.title||p.item_name)}</span><span class="kind">News draft</span></div>
      ${d.dek?`<div class="why">${esc(d.dek)}</div>`:''}
      ${src.length?`<div class="src">${src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t).slice(0,48)} ↗</a>`).join('')}</div>`:''}
      <div class="acts"><button class="pv" data-preview="${esc(p.doc_id)}">Preview</button><button class="ok" data-ok="${esc(p.id)}">Publish</button><button class="no" data-no="${esc(p.id)}">Reject</button></div></div>`;
  }
  let body='';
  if(p.kind==='update'&&p.changes){
    body=`<div class="diff">${Object.keys(p.changes).map(k=>`<span>${esc(k)}</span><span>${p.previous&&p.previous[k]!==undefined?`<s>${esc(fmtVal(k,p.previous[k]))}</s> → `:''}${esc(fmtVal(k,p.changes[k]))}</span>`).join('')}</div>`;
  }else if(p.kind==='add'&&p.data){
    const d=p.data;body=`<div class="diff"><span>price</span><span>${esc(money(Number(d.price)||0))}</span>${['brand','roaster','origin','burr','heat','roast'].filter(k=>d[k]).map(k=>`<span>${k}</span><span>${esc(d[k])}</span>`).join('')}</div>`;
  }
  const src=(p.sources||[]).map(x=>({t:x.title||x.url,u:safeUrl(x.url)})).filter(x=>x.u).slice(0,4);
  return `<div class="prop"><div class="top"><span class="what">${esc(p.item_name||p.doc_id)}</span><span class="kind">${KIND[p.kind]||esc(p.kind)}${(()=>{const c=p.collection==='beans'?'bean':((p.data&&p.data.cat)||(RAW.gear.find(g=>g.id===p.doc_id)||{}).cat||'');return c?' · '+esc(c==='espresso'?'machine':c):''})()}</span></div>
    ${p.reason?`<div class="why">${esc(p.reason)}</div>`:''}${body}
    ${src.length?`<div class="src">${src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t).slice(0,48)} ↗</a>`).join('')}</div>`:''}
    <div class="acts"><button class="ok" data-ok="${esc(p.id)}">Approve</button><button class="no" data-no="${esc(p.id)}">Reject</button></div></div>`;
}
async function decide(id,ok){
  const {error}=await SB.rpc(ok?'apply_proposal':'reject_proposal',{pid:id});
  if(error){toast('Couldn’t save that. Try again.');return false}
  toast(ok?'Approved':'Rejected');
  PENDING=PENDING.filter(p=>p.id!==id);updateReviewBtn();
  if(layer.querySelector('#reviewList'))openReview();
  return true;
}
function openReview(){
  openModal(`<h2 class="mt">Review queue</h2><p class="ms">${PENDING.length?`${PENDING.length} change${PENDING.length>1?'s':''} from the research agent. News drafts are published only when you choose Publish.`:'All caught up'}</p>
    ${PENDING.length>1?`<div class="allbar"><span class="ms" style="margin:0">Approve applies the change to the live site.</span><button class="pill" id="okAll">Approve all catalog changes</button></div>`:''}
    <div id="reviewList">${PENDING.map(propHtml).join('')}</div>`);
  const list=document.getElementById('reviewList');
  list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.preview){closeModal();location.hash='news/'+b.dataset.preview;return}
    b.disabled=true;const ok=!!b.dataset.ok, id=b.dataset.ok||b.dataset.no, isNews=(PENDING.find(p=>p.id===id)||{}).collection==='news';
    if(await decide(id,ok)&&ok){if(isNews)loadNews();else loadCatalog(false)}});
  const all=document.getElementById('okAll');
  // Approve all covers catalog changes only; news drafts are always published one at a time
  if(all)all.onclick=async()=>{all.disabled=true;for(const p of PENDING.filter(x=>x.collection!=='news'))await decide(p.id,true);loadCatalog(false)};
}
document.getElementById('reviewBtn').onclick=openReview;

function renderAll(){renderMain(false);renderSide();renderSign()}
function layout(){renderMain(false)}
function renderSheet(){renderSide()}
if(location.hash!=='#owner')route();renderSide();renderSign();boot();
