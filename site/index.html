<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brewfinder</title>
<meta name="description" content="Build your coffee setup: answer a few questions and see the grinders, espresso machines and beans that fit.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen stage of floating products. Top matches sit large and labelled in the middle,
   the rest drift around the edges. A floating question card sits at the bottom (desktop) or a sheet (phone). */
:root{
  --bg:#F4F4F2; --card:#FFFFFF; --tile:#F2F2F0; --tile-hover:#EAEAE7; --ink:#1B1B1A; --muted:#6E6D69; --line:#E4E3DF;
  --shadow:rgba(20,20,18,.10); --shadow-strong:rgba(20,20,18,.18); --accent:#B8792F; --scrim:rgba(20,20,18,.32);
  --f-ui:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --card:#1D1D1B; --tile:#262624; --tile-hover:#2F2F2C; --ink:#F1F0EC; --muted:#9E9C95; --line:#33322F;
  --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --accent:#E0A45A; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --card:#1D1D1B; --tile:#262624; --tile-hover:#2F2F2C; --ink:#F1F0EC; --muted:#9E9C95; --line:#33322F;
  --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --accent:#E0A45A; --scrim:rgba(0,0,0,.55); color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- header ---------- */
.top{position:fixed;inset:0 0 auto;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 14px max(24px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.logo{justify-self:start;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.03em;font-size:17px}
.logo svg{width:30px;height:30px}
.tabs{display:flex;gap:2px;background:var(--line);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;width:56px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.right{justify-self:end;display:flex;align-items:center;gap:10px}
.dark-pill{border:0;background:var(--ink);color:var(--bg);height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px}
.circle{border:0;background:var(--card);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 4px var(--shadow),0 0 0 1px var(--line) inset}
.circle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.review{border:0;background:var(--accent);color:#fff;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;z-index:1}
.p{position:absolute;border:0;background:none;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);transition:left .75s cubic-bezier(.22,.8,.22,1),top .75s cubic-bezier(.22,.8,.22,1),width .75s cubic-bezier(.22,.8,.22,1),opacity .45s ease,filter .45s ease}
.p .img{display:block;width:100%;aspect-ratio:1;transition:transform .2s ease}
.p .img>svg,.p .img>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}
.p .txt{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max(150%,220px);text-align:center;padding-top:10px;opacity:0;transition:opacity .35s ease;pointer-events:none}
.p .nm{font-weight:500;font-size:clamp(14px,1.15vw,19px);line-height:1.25;text-wrap:balance}
.p .sub{font-size:clamp(13px,.95vw,16px);color:var(--muted);margin-top:2px}
.p.feat .txt{opacity:1;transition-delay:.35s}
@media (hover:hover){.p:hover .img{transform:translateY(-4px)} .p:not(.feat):hover .txt{opacity:1;transition-delay:0s}}
.p:active .img{transform:scale(.97)}
.p.gone{opacity:0;filter:blur(14px);pointer-events:none}
.p.gone .img{transform:scale(.88)}
.p.enter{opacity:0;filter:blur(10px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p .img>svg{filter:drop-shadow(0 0 .7px rgba(255,255,255,.4))}}
:root[data-theme="dark"] .p .img>svg{filter:drop-shadow(0 0 .7px rgba(255,255,255,.4))}
.empty{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);max-width:min(420px,80vw);font-size:16px}

/* ---------- question card ---------- */
.card{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 16px));
  width:min(940px,calc(100vw - 48px));background:var(--card);border-radius:22px;box-shadow:0 12px 48px var(--shadow),0 0 0 1px var(--line) inset;
  padding:22px clamp(20px,2.4vw,36px) clamp(24px,2.4vw,36px)}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:24px;font-size:13px;color:var(--muted)}
.ghost{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 0}
.ghost:hover{color:var(--ink)}
.ghost[disabled]{visibility:hidden}
.q{font-size:clamp(24px,2.3vw,36px);font-weight:600;letter-spacing:-.025em;text-align:center;margin:4px 0 clamp(18px,2vw,30px);text-wrap:balance}
.qsub{text-align:center;color:var(--muted);font-size:15px;margin:-14px 0 22px}
.opts{display:flex;gap:12px}
.opt{flex:1 1 0;min-width:0;border:0;background:var(--tile);border-radius:14px;padding:clamp(18px,2.4vh,30px) 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .15s,transform .12s}
.opt b{font-size:clamp(15px,1.15vw,18px);font-weight:600}
.opt span{font-size:clamp(13px,1vw,16px);color:var(--muted)}
.opt:active{transform:scale(.98)}
@media (hover:hover){.opt:hover{background:var(--tile-hover)}}
.opt[disabled]{opacity:.35;cursor:default}
.done-acts{display:flex;justify-content:center;gap:10px}
.soft-pill{border:0;background:var(--tile);height:46px;padding:0 22px;border-radius:999px;font-weight:600}
.anim-in{animation:qin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateY(8px)}}

/* ---------- phone toolbar ---------- */
.bar{display:none}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);width:100%;max-width:520px;max-height:86vh;overflow-y:auto;border-radius:24px;padding:12px 24px 24px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:980px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{display:none}
.mhead{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:1}
.x{border:0;background:var(--tile);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.hero{width:min(64%,280px);aspect-ratio:1;margin:-8px auto 6px}
.hero>svg,.hero>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.mt{text-align:center;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ms{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0}
.price{text-align:center;font-family:var(--f-mono);font-size:15px;margin:10px 0 16px}
.note{font-size:15px;margin:0 0 16px}
dl.specs{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dl.specs dt{color:var(--muted);padding-right:16px}
dl.specs dd{text-align:right}
.range{margin:-6px 0 18px}
.range .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.range .tr{height:8px;border-radius:4px;background:var(--tile);position:relative}
.range .tr i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.buy{display:flex;flex-direction:column;gap:8px}
.buy a,.buy button{display:flex;justify-content:space-between;align-items:center;text-decoration:none;border-radius:14px;padding:14px 16px;font-weight:600;border:0}
.buy .pri{background:var(--ink);color:var(--card)}
.buy .sec{background:var(--tile);color:var(--ink)}
.buy small{font-weight:400;opacity:.7}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.setrow .th{width:56px;height:56px}
.setrow .th>svg,.setrow .th>img{width:100%;height:100%;object-fit:contain}
.setrow button.rm{border:0;background:none;color:var(--muted);font-size:13px}
.setrow .nm2{font-weight:600}
.setrow .pp{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:600}
.tot span{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(50% - 20px);transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;animation:fade .2s}

/* browse all */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px 16px;margin-top:20px}
.bitem{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bitem .bimg{width:100%;aspect-ratio:1;background:var(--tile);border-radius:16px;padding:14%;display:block}
.bitem .bimg>svg,.bitem .bimg>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.bitem .nm{font-weight:500;font-size:14px;line-height:1.25}
.bitem .pr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bitem.dim{opacity:.4}
.seg{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* search */
.sinput{width:100%;font:inherit;font-size:18px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:10px 2px;outline:none}
.sres{margin-top:8px}
.sres .setrow{cursor:pointer}
.slabel{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* menu */
.mlist{display:flex;flex-direction:column;margin-top:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px;width:100%}
.mrow span{color:var(--muted);font-size:14px}
.mrow select{font:inherit;font-size:14px;color:var(--ink);background:var(--tile);border:0;border-radius:999px;padding:6px 10px}
/* review */
.prop{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.prop .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;position:static;padding:0;pointer-events:auto}
.prop .kind{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.prop .what{font-weight:600}
.prop .why{font-size:14px;color:var(--muted)}
.prop .diff{font-family:var(--f-mono);font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.prop .diff s{color:var(--muted)}
.prop .src{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.prop .src a{color:var(--muted)}
.prop .acts{display:flex;gap:8px;margin-top:4px}
.prop .acts button{border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.prop .ok{background:var(--ink);color:var(--card)}
.prop .no{background:var(--tile)}
.allbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.pill{border:0;background:var(--tile);border-radius:999px;height:40px;padding:0 16px;font-weight:600}

/* ---------- phone ---------- */
@media (max-width:760px){
  .top{grid-template-columns:auto 1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .logo span{display:none}
  .tabs{justify-self:center}
  .tabs button{width:clamp(34px,9.4vw,46px);height:40px}
  .tabs svg{width:21px;height:21px}
  .right .dark-pill,.right #searchBtn,.right .review{display:none}
  .circle{width:44px;height:44px}
  .card{left:0;right:0;transform:none;bottom:0;width:auto;border-radius:24px 24px 0 0;box-shadow:0 -6px 28px var(--shadow);
    padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .q{font-size:24px;margin:2px 0 14px}
  .qsub{margin:-8px 0 14px}
  .opts{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-snap-type:x mandatory}
  .opts::-webkit-scrollbar{display:none}
  .opt{flex:0 0 calc((100% - 24px)/3.1);scroll-snap-align:start;padding:16px 8px}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-top:1px solid var(--line);
    padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .stack{border:0;background:none;width:64px;height:48px;position:relative;padding:0}
  .stack .t{position:absolute;bottom:0;width:40px;height:40px;border-radius:9px;background:var(--tile);box-shadow:0 1px 3px var(--shadow);padding:3px}
  .stack .t>svg,.stack .t>img{width:100%;height:100%;object-fit:contain}
  .stack .none{position:absolute;inset:4px 18px 4px 0;border:1.5px dashed var(--line);border-radius:9px}
  .bar .soft-pill{height:48px;padding:0 26px}
  .bar .circle{box-shadow:none;background:var(--tile)}
  .modal{max-width:none;border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end;padding:0}
  .grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
  .bgrid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
  .p .txt{width:max(120%,150px)}
  .p .nm{font-size:15px}
  .p .sub{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#grinders" aria-label="Brewfinder home"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="9.5" ry="13" transform="rotate(32 16 16)" fill="currentColor"/><path d="M11.6 6.8c4.4 4.6 1.2 12.6 8.8 18.4" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/></svg><span>Brewfinder</span></a>
  <div class="tabs" role="tablist" aria-label="Product type" id="tabs"></div>
  <div class="right">
    <button class="review" id="reviewBtn" hidden></button>
    <button class="dark-pill" id="browseBtn">Browse all</button>
    <button class="circle" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="circle" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
  </div>
</header>

<main class="stage" id="stage" aria-label="Products"></main>

<section class="card" id="card" aria-live="polite">
  <div class="card-top"><button class="ghost" id="back">← Back</button><span id="step"></span><button class="ghost" id="reset">Start over</button></div>
  <div id="qwrap"></div>
</section>

<nav class="bar" aria-label="Toolbar">
  <button class="stack" id="stack" aria-label="My setup"></button>
  <button class="soft-pill" id="browseBtn2">Browse all</button>
  <button class="circle" id="searchBtn2" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</nav>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* ---------- affiliate config: replace with your real tags ---------- */
const AFFILIATE={amazonTag:'YOURTAG-20'};

/* ---------- catalog: live from the artifact database (prices stored in USD) ---------- */
let GEAR=[];            // merged view of gear + beans, active items only
let RAW={gear:[],beans:[]};
let FX={USD:1};
let LOAD='loading';     // loading | ready | offline | stale
let PENDING=[];         // proposals awaiting review (editors only)
let isEditor=false, SB=null, SESSION=null;

const ICON={
  grinders:'<path d="M9 10h6v10H9z"/><path d="M8 10h8"/><path d="M12 10V4h6"/><circle cx="18.5" cy="4" r="1.5"/>',
  espresso:'<rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9 9h6"/><path d="M10 16v2.5h4V16"/><path d="M3 20.5h18"/>',
  brewers:'<path d="M4.5 6h15l-5 9h-5z"/><path d="M7 19.5h10"/><path d="M12 15v4.5"/>',
  kettles:'<path d="M7 20v-7a5 5 0 0 1 10 0v7z"/><path d="M7 15c-3 0-3.5-5-5-7"/><path d="M17 12h1.5a2 2 0 0 1 0 4H17"/><path d="M12 8V6.5"/>',
  scales:'<path d="M3 14h18l1.5 5h-21z"/><path d="M10 16.5h4"/>',
  beans:'<ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(30 12 12)"/><path d="M8.5 5.5c3 3 .5 9 6.5 13"/>'
};
const CURS={USD:'US dollar',CAD:'Canadian dollar',EUR:'Euro',GBP:'British pound',AUD:'Australian dollar'};
const cur=()=>FX[S.cur]?S.cur:'USD';
function money(usd){
  const c=cur(), v=usd*(FX[c]||1);
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}catch(e){return '$'+Math.round(v)}
}
function nice(usd){const v=usd*(FX[cur()]||1), st=v>=100?10:5;return Math.round(v/st)*st/(FX[cur()]||1)}
const under=n=>()=>`Under ${money(nice(n))}`, span=(a,b)=>()=>`${money(nice(a))}–${money(nice(b))}`, over=n=>()=>`${money(nice(n))}+`;
const B=(lo,hi)=>g=>g.price>=lo&&g.price<hi;
const TABS=[
 {key:'grinders',cat:'grinder',label:'Grinders',qs:[
   {id:'for',q:'What are you grinding for?',o:[['espresso','Espresso','Fine, even grounds',g=>g.does.includes('espresso')],['filter','Filter','Pour-over, drip, press',g=>g.does.includes('filter')],['both','Both','One grinder for all',g=>g.does.length===2]]},
   {id:'power',q:'Hand crank or electric?',o:[['hand','Hand crank','Quiet and portable',g=>g.kind==='hand'],['electric','Electric','Push a button',g=>g.kind!=='hand']]},
   {id:'budget',q:"What's your budget?",o:[['lo',under(150),'Get started',B(0,150)],['mid',span(150,400),'The sweet spot',B(150,400)],['hi',over(400),'Buy once',B(400,1e9)]]}

function geom(){

  if(!phoneMQ.matches) return {x:0,y:0,w:W,h:H,set:DESK,fs:Math.min(W*.127,H*.24),ss:Math.min(W*.063,H*.12)};
  const top=document.querySelector('.top').getBoundingClientRect().bottom;
  const bottom=cardEl.getBoundingClientRect().top-8;
  const h=Math.max(bottom-top,200);
  return {x:0,y:top,w:W,h,set:PHONE,fs:Math.min(W*.31,h*.27),ss:Math.min(W*.15,h*.13)};
}
function makeEl(it){
  const b=document.createElement('button');
  b.className='p';b.dataset.id=it.id;b.setAttribute('aria-label',`${it.name}, about ${money(it.price||0)}`);
  b.innerHTML=`<span class="img">${pic(it)}</span><span class="txt"><div class="nm">${esc(it.name)}</div><div class="sub">${esc(sub(it))}</div></span>`;
  b.addEventListener('click',()=>openProduct(it.id));
  return b;
}
function place(n,g,pt,size){
  n.style.left=(g.x+g.w*pt[0]/100)+'px';
  n.style.top=(g.y+g.h*pt[1]/100)+'px';
  n.style.width=size+'px';
}
function layout(fresh){
  const t=tab(), all=GEAR.filter(x=>x.cat===t.cat).sort(byPop), list=matches(t,S.answers[t.key]);
  const g=geom(), slots=[...g.set.feat.map(p=>({p,s:g.fs,feat:true})),...g.set.small.map(p=>({p,s:g.ss,feat:false}))];
  const rebuild=fresh||shownTab!==t.key;
  if(rebuild){stage.innerHTML='';nodes=new Map();shownTab=t.key}
  // keep nodes in step with the catalog
  const ids=new Set(all.map(x=>x.id));
  nodes.forEach((n,id)=>{if(!ids.has(id)){n.remove();nodes.delete(id)}});
  const created=[];
  all.forEach((it,i)=>{
    let n=nodes.get(it.id);
    if(!n){n=makeEl(it);n.style.transition='none';const sl=slots[i]||slots[slots.length-1];place(n,g,sl.p,sl.s);
      if(!reduce)n.classList.add('enter');stage.appendChild(n);nodes.set(it.id,n);created.push(n)}
    else{ // refresh content in case the record changed (price, photo)
      n.querySelector('.img').innerHTML=pic(it);n.querySelector('.nm').textContent=it.name;n.querySelector('.sub').textContent=sub(it)}
  });
  const keep=new Set(list.map(x=>x.id));
  list.forEach((it,i)=>{
    const n=nodes.get(it.id), sl=slots[i];
    if(!sl){n.classList.add('gone');n.classList.remove('feat');n.tabIndex=-1;return}
    place(n,g,sl.p,sl.s);
    n.classList.toggle('feat',sl.feat);n.classList.remove('gone');n.tabIndex=0;n.style.zIndex=sl.feat?2:1;
  });
  nodes.forEach((n,id)=>{if(!keep.has(id)){n.classList.add('gone');n.classList.remove('feat');n.tabIndex=-1}});
  if(created.length){
    void stage.offsetWidth;
    created.forEach((n,i)=>{n.style.transition='';if(!reduce)setTimeout(()=>n.classList.remove('enter'),40+i*45)});
  }
  stage.querySelectorAll('.empty').forEach(e=>e.remove());
  if(!list.length){
    const msg=LOAD==='offline'?'The catalog couldn’t load. Refresh the page to try again.'
      :LOAD==='loading'?'Loading the catalog…'
      :!all.length?(t.cat==='bean'?'No beans in the catalog yet. Approve the research agent’s first picks in the review queue.':'Nothing in this category yet.')
      :'Nothing matches every answer. Go back a step or choose “No preference”.';
    stage.insertAdjacentHTML('beforeend',`<div class="empty">${msg}</div>`);
  }
}

function renderSheet(){
  const t=tab(), ans=S.answers[t.key], step=stepOf(t), n=matches(t,ans).length, any=Object.keys(ans).length>0;
  document.getElementById('back').disabled=!any;
  document.getElementById('reset').disabled=!any;

    qwrap.innerHTML=`<div class="anim-in"><h2 class="q">${n?'Here’s your shortlist':'No exact match'}</h2>
      <p class="qsub">${n?'Tap a product for specs and where to buy it.':'Go back a step, or start over.'}</p>

async function boot(){
  const cfg=window.CATALOG_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){LOAD='offline';renderAll(true);return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  await loadCatalog(true);
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;setTimeout(checkAdmin,0)});
  const {data}=await SB.auth.getSession();SESSION=data.session;checkAdmin();

async function loadCatalog(first){
  try{
    const [g,b,m]=await Promise.all([SB.from('gear').select('id,doc'),SB.from('beans').select('id,doc'),SB.from('meta').select('id,doc').eq('id','fx').maybeSingle()]);

    RAW.gear=g.data.map(r=>({id:r.id,...r.doc}));RAW.beans=b.data.map(r=>({id:r.id,...r.doc}));

const KIND={add:'New',update:'Update',discontinue:'Discontinue'};
function fmtVal(k,v){if(k==='price')return money(Number(v)||0);if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.label||x.title||''):x).join(', ');if(v&&typeof v==='object')return JSON.stringify(v);return String(v)}
function propHtml(p){
  let body='';
  if(p.kind==='update'&&p.changes){
    body=`<div class="diff">${Object.keys(p.changes).map(k=>`<span>${esc(k)}</span><span>${p.previous&&p.previous[k]!==undefined?`<s>${esc(fmtVal(k,p.previous[k]))}</s> → `:''}${esc(fmtVal(k,p.changes[k]))}</span>`).join('')}</div>`;
  }else if(p.kind==='add'&&p.data){
    const d=p.data;body=`<div class="diff"><span>price</span><span>${esc(money(Number(d.price)||0))}</span>${['brand','roaster','origin','burr','heat','roast'].filter(k=>d[k]).map(k=>`<span>${k}</span><span>${esc(d[k])}</span>`).join('')}</div>`;
  }
  const src=(p.sources||[]).map(x=>({t:x.title||x.url,u:safeUrl(x.url)})).filter(x=>x.u).slice(0,4);
  return `<div class="prop"><div class="top"><span class="what">${esc(p.item_name||p.doc_id)}</span><span class="kind">${KIND[p.kind]||esc(p.kind)}${(()=>{const c=p.collection==='beans'?'bean':((p.data&&p.data.cat)||(RAW.gear.find(g=>g.id===p.doc_id)||{}).cat||'');return c?' · '+esc(c==='espresso'?'machine':c):''})()}</span></div>
    ${p.reason?`<div class="why">${esc(p.reason)}</div>`:''}${body}
    ${src.length?`<div class="src">${src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t).slice(0,48)} ↗</a>`).join('')}</div>`:''}
    <div class="acts"><button class="ok" data-ok="${esc(p.id)}">Approve</button><button class="no" data-no="${esc(p.id)}">Reject</button></div></div>`;
}
async function decide(id,ok){
  const {error}=await SB.rpc(ok?'apply_proposal':'reject_proposal',{pid:id});
  if(error){toast('Couldn’t save that. Try again.');return false}
  toast(ok?'Approved':'Rejected');
  PENDING=PENDING.filter(p=>p.id!==id);updateReviewBtn();
  if(layer.querySelector('#reviewList'))openReview();
  return true;
}
function openReview(){
  openModal(`<h2 class="mt">Review queue</h2><p class="ms">${PENDING.length?`${PENDING.length} change${PENDING.length>1?'s':''} from the research agent`:'All caught up'}</p>
    ${PENDING.length>1?`<div class="allbar"><span class="ms" style="margin:0">Approve applies the change to the live site.</span><button class="pill" id="okAll">Approve all</button></div>`:''}
    <div id="reviewList">${PENDING.map(propHtml).join('')}</div>`);
  const list=document.getElementById('reviewList');
  list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;b.disabled=true;const ok=!!b.dataset.ok;if(await decide(b.dataset.ok||b.dataset.no,ok)&&ok)loadCatalog(false)});
  const all=document.getElementById('okAll');
  if(all)all.onclick=async()=>{all.disabled=true;for(const p of [...PENDING])await decide(p.id,true);loadCatalog(false)};
}
document.getElementById('reviewBtn').onclick=openReview;


function renderAll(fresh){
  TABS.forEach(t=>document.getElementById('tab-'+t.key).setAttribute('aria-selected',t.key===S.tab));
  renderSheet();layout(fresh);renderSetup();
}
renderAll(true);boot();
</script>
</body>
