/* Layout: a scrolling browsing pane of product sections on the left and the setup assistant on the right.

  --shadow-raised:0 12px 48px rgba(17,17,17,.10); --shadow-control:0 1px 4px rgba(17,17,17,.10);

  --gap-tight:4px; --gap-stack:8px; --gap-controls:12px; --inset-control:16px; --inset-surface:24px; --inset-surface-lg:36px; --gutter-page:24px; --gutter-page-compact:16px;
  --radius-control:999px; --radius-option:14px; --radius-surface:22px;
  --radius-section:16px; --radius-thumb:12px; --size-thumb:60px; --gap-thumb:8px; --gutter-page-wide:32px; --width-sidebar:400px; --height-header:72px; --height-footer:44px; --gap-section:24px; --width-chat:360px; --radius-bento:16px; --radius-container:24px; --radius-compact:8px; --height-header:64px;

}

/* ---------- layout: browsing pane on the left, setup assistant on the right ---------- */

.sec+.sec{margin-top:var(--gap-section)}

.tb{width:var(--size-thumb);height:var(--size-thumb);border:0;background:none;padding:5px;border-radius:var(--radius-thumb);display:block}
.tb>svg,.tb>img{width:100%;height:100%;display:block;object-fit:contain;overflow:visible}

.more{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.3;padding:0}
.more span{font-size:11px;color:var(--text-secondary)}

/* category page */
.cat-h{padding:var(--gap-stack) var(--inset-control) var(--inset-surface)}
.backl{color:var(--text-secondary);font-size:13px;text-decoration:none}

.top2{grid-column:1/-1;display:flex;align-items:center;gap:var(--gap-controls);padding:0 var(--inset-surface) 0 32px}
.top2 .logo{font-size:15px;letter-spacing:-.01em;margin-right:auto}
.top2 .search{position:relative;display:flex;align-items:center;width:min(360px,45vw);height:36px;border:1px solid var(--border-subtle);border-radius:var(--radius-compact);padding:0 12px 0 4px}
.top2 .search-btn{width:32px;height:32px;color:var(--text-secondary);pointer-events:none}
.top2 .search-btn .ic{width:18px;height:18px}
.top2 .search input,.top2 .search.open input{flex:1;width:auto;opacity:1;visibility:visible;border:0;padding:0;font-size:15px;transition:none}
.top2 .sdrop{left:0;right:auto;width:min(420px,calc(100vw - 32px));top:calc(100% + 8px)}
.chatcol{grid-column:1;grid-row:2;height:auto}
.chatcol .thread{padding:var(--gap-stack) var(--inset-surface) var(--inset-control) 32px;gap:var(--gap-controls)}
.chatcol .side-f{padding:var(--gap-stack) var(--inset-surface) 0 var(--inset-surface)}
.main{grid-column:2;grid-row:2;height:auto!important;padding:0!important;margin:0 var(--inset-surface) 0 0;background:var(--surface-page);border-radius:var(--radius-container);overflow-y:auto}
.groups,.groups.catpage{background:none;border-radius:0;min-height:0;margin:0;padding:var(--inset-control)}
.groups.catpage{padding-top:var(--gap-stack)}
.bentos{gap:var(--inset-control)}
.bento{border-radius:var(--radius-bento);padding:var(--inset-control) var(--inset-control) var(--gap-stack)}
.foot{grid-column:2;grid-row:3;position:static!important;justify-content:flex-end;min-height:var(--height-footer);padding:0 var(--inset-surface) 0 0;font-size:13px}
/* type: 24 light for titles, 15 regular for reading, 13 for supporting text */
.sec-t{font-size:15px}
.b-n,.fam-n,.count,.backl,.chip,.p .nm,.b-msg{font-size:13px}
.cat-t{font-size:24px;letter-spacing:-.02em}
.cat-h{padding:var(--gap-stack) var(--gap-tight) var(--inset-control)}
.qh{font-size:24px;line-height:1.25}
.qs,.past,.qlab,.tune .hint,.ans button small,.kit-row small{font-size:13px;letter-spacing:0;text-transform:none}
.qsmall,.me,.bot,.ans button,.kit-row b,.kit-row .pz,.kit-tot{font-size:15px}
.tune .qh{font-size:24px}
.qs{margin:0}
.me{border-radius:var(--radius-option)}
/* answers: no fill, rows split by hairlines; subtle check boxes */
.ans{gap:0;margin:var(--gap-tight) 0 0}
.ans button{background:none;border-radius:0;min-height:44px;padding:10px 2px;border-bottom:1px solid var(--border-subtle)}
.ans button:first-child{border-top:1px solid var(--border-subtle)}
@media (hover:hover){.ans button:hover{background:var(--surface-hover-subtle)}}
.box{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-subtle)}
[aria-pressed="true"] .box{background:var(--action-primary);border-color:var(--action-primary)}
.ans-acts{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-controls);margin-top:var(--gap-controls)}
.linkish{border:0;background:none;padding:0;font-size:13px;color:var(--text-secondary);text-align:left}
@media (hover:hover){.linkish:hover{color:var(--text-primary)}}
.ans-acts .go{border:0;height:32px;padding:0 14px;border-radius:var(--radius-compact);background:var(--action-primary);color:var(--text-on-action);font-size:13px}
.ans-acts .go[disabled]{opacity:.35;cursor:default}
/* chat box like Claude's: a quiet rectangle with a small square send button */
.chat{flex-direction:column;align-items:stretch;height:auto;gap:var(--gap-stack);border-radius:var(--radius-option);padding:14px 10px 10px 16px;background:var(--surface-raised)}
.chat input{font-size:15px;padding-right:6px}
.chat .send{align-self:flex-end;width:32px;height:32px;border-radius:var(--radius-compact);background:var(--surface-control);color:var(--text-secondary)}
.chat .send .ic{width:18px;height:18px}
.chat.has-text .send{background:var(--action-primary);color:var(--text-on-action)}
@media (max-width:760px){
  .app{display:block!important}
  .top2{height:var(--height-header);padding:0 var(--gutter-page-compact)}
  .top2 .search{width:55vw}
  .chatcol .thread{padding:var(--gap-stack) var(--gutter-page-compact) var(--inset-control)}
  .chatcol .side-f{padding:0 var(--gutter-page-compact) var(--inset-control)}
  .main{margin:0 var(--gap-stack);overflow:visible;border-radius:var(--radius-bento)}
  .groups{padding:var(--gap-stack)}
  .foot{justify-content:center;padding:var(--gap-stack) var(--gutter-page-compact)}
}

/* ---------- 2026-11-23 pass 2: shorter chat, softer hairlines, round search ---------- */
.chat{flex-direction:row!important;align-items:center!important;height:52px!important;padding:0 8px 0 16px!important;gap:var(--gap-stack)}
.chat .send{align-self:center!important}
.ans button{border-bottom:1px solid var(--surface-control)}
.ans button:first-child{border-top:0}
.ans button:last-child{border-bottom:0}
.top2 .search{width:auto;height:40px;border:1px solid transparent;border-radius:var(--radius-control);padding:0 4px;transition:border-color .2s}
.top2 .search input,.top2 .search.open input{width:0;opacity:0;visibility:hidden;flex:none;transition:width .25s ease,opacity .2s,visibility .25s}
.top2 .search.open{border-color:var(--border-subtle);padding-left:16px}
.top2 .search.open input{width:min(280px,45vw);opacity:1;visibility:visible}
.top2 .search-btn{pointer-events:auto;color:var(--text-primary);border-radius:50%}
.top2 .search-btn .ic{width:20px;height:20px}
.top2 .search{flex-direction:row-reverse}
.top2 .sdrop{left:auto;right:0}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay-scrim);z-index:20;display:flex;align-items:center;justify-content:center;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface-raised);width:100%;max-width:520px;max-height:86vh;overflow-y:auto;border-radius:var(--radius-surface);padding:12px 24px 24px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:980px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{display:none}
.mhead{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:1}
.x{border:0;background:var(--surface-control);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.hero{width:min(64%,280px);aspect-ratio:1;margin:-8px auto 6px}
.hero>svg,.hero>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.mt{text-align:center;font-size:24px;font-weight:300;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ms{text-align:center;color:var(--text-secondary);font-size:14px;margin:4px 0 0}
.price{text-align:center;font-variant-numeric:tabular-nums;font-family:var(--font-sans);font-size:15px;margin:10px 0 16px}
.note{font-size:15px;margin:0 0 16px}
dl.specs{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--border-subtle)}
dl.specs dt,dl.specs dd{margin:0;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
dl.specs dt{color:var(--text-secondary);padding-right:16px}
dl.specs dd{text-align:right}
.range{margin:-6px 0 18px}
.range .lab{display:flex;justify-content:space-between;font-family:var(--font-sans);font-size:10.5px;color:var(--text-secondary);margin-top:6px}
.range .tr{height:8px;border-radius:4px;background:var(--surface-sunken);position:relative}
.range .tr i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.buy{display:flex;flex-direction:column;gap:8px}
.buy a,.buy button{display:flex;justify-content:space-between;align-items:center;text-decoration:none;border-radius:var(--radius-option);padding:14px 16px;font-weight:400;border:0}
.buy .pri{background:var(--action-primary);color:var(--text-on-action)}
.buy .sec{background:var(--surface-control);color:var(--text-primary)}
.buy small{font-weight:400;opacity:.7}
.disc{font-size:12px;color:var(--text-secondary);text-align:center;margin:12px 0 0}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.setrow .th{width:56px;height:56px}
.setrow .th>svg,.setrow .th>img{width:100%;height:100%;object-fit:contain}
.setrow button.rm{border:0;background:none;color:var(--text-secondary);font-size:13px}
.setrow .nm2{font-weight:400}
.setrow .pp{font-family:var(--font-sans);font-size:13px;color:var(--text-secondary)}
.tot{display:flex;justify-content:space-between;padding:14px 0 4px;font-weight:400}
.tot span{font-family:var(--font-sans)}
.toast{position:fixed;left:50%;bottom:calc(50% - 20px);transform:translateX(-50%);background:var(--action-primary);color:var(--text-on-action);padding:10px 18px;border-radius:var(--radius-control);font-size:14px;z-index:30;animation:fade .2s}

/* browse all */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px 16px;margin-top:20px}
.bitem{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bitem .bimg{width:100%;aspect-ratio:1;background:var(--surface-control);border-radius:var(--radius-option);padding:14%;display:block}
.bitem .bimg>svg,.bitem .bimg>img{width:100%;height:100%;object-fit:contain;overflow:visible}
.bitem .nm{font-weight:400;font-size:14px;line-height:1.25}
.bitem .pr{font-family:var(--font-sans);font-size:12.5px;color:var(--text-secondary)}
.bitem.dim{opacity:.4}
.seg{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{border:1px solid var(--border-subtle);background:none;border-radius:var(--radius-control);padding:6px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--action-primary);color:var(--text-on-action);border-color:var(--text-primary)}
/* search */
.sinput{width:100%;font:inherit;font-size:18px;border:0;border-bottom:1px solid var(--border-subtle);background:none;color:var(--text-primary);padding:10px 2px;outline:none}
.sres{margin-top:8px}
.sres .setrow{cursor:pointer}
.slabel{font-family:var(--font-sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
/* menu */
.mlist{display:flex;flex-direction:column;margin-top:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--border-subtle);background:none;text-align:left;font-size:16px;width:100%}
.mrow span{color:var(--text-secondary);font-size:14px}
.mrow select{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-control);border:0;border-radius:var(--radius-control);padding:6px 10px}
/* review */
.prop{border-bottom:1px solid var(--border-subtle);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.prop .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;position:static;padding:0;pointer-events:auto}
.prop .kind{font-family:var(--font-sans);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.prop .what{font-weight:400}
.prop .why{font-size:14px;color:var(--text-secondary)}
.prop .diff{font-family:var(--font-sans);font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.prop .diff s{color:var(--text-secondary)}
.prop .src{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.prop .src a{color:var(--text-secondary)}
.prop .acts{display:flex;gap:8px;margin-top:4px}
.prop .acts button{border:0;border-radius:10px;padding:8px 14px;font-weight:400;font-size:14px}
.prop .ok{background:var(--action-primary);color:var(--text-on-action)}
.prop .no{background:var(--surface-control)}
.allbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.pill{border:0;background:var(--surface-control);border-radius:var(--radius-control);height:40px;padding:0 16px;font-weight:400}

/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--gutter-page-wide:var(--gutter-page-compact)}
  .app,.app.closed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:15;border:0}
  .app.closed .side{display:none}
  .cat-t{font-size:28px}
  .foot{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .modal{max-width:none;border-radius:var(--radius-surface) var(--radius-surface) 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end;padding:0}
  .grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--surface-sunken);margin:0 auto 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
b,strong{font-weight:400}
.opt b{color:var(--text-primary)}
.note strong{color:var(--text-primary)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top2">
    <a class="logo" href="#" aria-label="catalog.cafe home">catalog.cafe</a>
    <button class="review" id="reviewBtn" hidden></button>
    <div class="search" id="search"><button class="search-btn" id="searchBtn" aria-label="Search" aria-expanded="false"></button><input id="searchIn" type="search" placeholder="Search machines, grinders, beans…" aria-label="Search products" autocomplete="off"><div class="sdrop" id="sdrop" hidden></div></div>
  </header>
  <aside class="chatcol" id="side" aria-label="Find your setup">
    <div class="thread" id="thread"></div>
    <div class="side-f">
      <div class="sugg" id="sugg" hidden></div>
      <form class="chat" id="chat"><input id="chatIn" type="text" placeholder="Tell me what you need…" aria-label="Tell the setup assistant what you need" autocomplete="off"><button class="send" aria-label="Send"></button></form>
    </div>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
  <footer class="foot">
    <button id="aboutBtn">About and affiliate disclosure</button><button id="signBtn">Sign in</button>
    <span>Bean data from <a href="https://www.loffeelabs.com/" target="_blank" rel="noopener">Loffee Labs</a></span>
  </footer>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* ---------- affiliate config: replace with your real tags ---------- */
const AFFILIATE={amazonTag:'YOURTAG-20'};

/* ---------- catalog: live from the artifact database (prices stored in USD) ---------- */
let GEAR=[];            // merged view of gear + beans, active items only
let RAW={gear:[],beans:[]};
let FX={USD:1};
let LOAD='loading';     // loading | ready | offline | stale
let PENDING=[];         // proposals awaiting review (editors only)
let isEditor=false, SB=null, SESSION=null;

const ICON={
  grinders:'<path d="M9 10h6v10H9z"/><path d="M8 10h8"/><path d="M12 10V4h6"/><circle cx="18.5" cy="4" r="1.5"/>',
  espresso:'<rect x="3.5" y="4" width="17" height="12" rx="1.5"/><path d="M9 9h6"/><path d="M10 16v2.5h4V16"/><path d="M3 20.5h18"/>',
  brewers:'<path d="M4.5 6h15l-5 9h-5z"/><path d="M7 19.5h10"/><path d="M12 15v4.5"/>',
  kettles:'<path d="M7 20v-7a5 5 0 0 1 10 0v7z"/><path d="M7 15c-3 0-3.5-5-5-7"/><path d="M17 12h1.5a2 2 0 0 1 0 4H17"/><path d="M12 8V6.5"/>',
  scales:'<path d="M3 14h18l1.5 5h-21z"/><path d="M10 16.5h4"/>',
  beans:'<ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(30 12 12)"/><path d="M8.5 5.5c3 3 .5 9 6.5 13"/>'
};
const CURS={USD:'US dollar',CAD:'Canadian dollar',EUR:'Euro',GBP:'British pound',AUD:'Australian dollar'};
const cur=()=>FX[S.cur]?S.cur:'USD';
function money(usd){
  const c=cur(), v=usd*(FX[c]||1);
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}catch(e){return '$'+Math.round(v)}
}
function nice(usd){const v=usd*(FX[cur()]||1), st=v>=100?10:5;return Math.round(v/st)*st/(FX[cur()]||1)}
const under=n=>()=>`Under ${money(nice(n))}`, span=(a,b)=>()=>`${money(nice(a))}–${money(nice(b))}`, over=n=>()=>`${money(nice(n))}+`;
const B=(lo,hi)=>g=>g.price>=lo&&g.price<hi;
/* ---------- icons (rounded outline, 24 px grid) ---------- */
const ICONS={
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/>',
  x:'<path d="M7 7l10 10M17 7 7 17"/>',
  send:'<path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"/>',
  right:'<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>',
  sideClose:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15"/><path d="m8 9.5 2.5 2.5L8 14.5"/>',
  check:'<path d="m6 12.5 4 4 8-9"/>'
};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

/* ---------- product types and their filters ----------
   Filters inside a group are alternatives (Hand or Electric); groups combine (Electric and Espresso). */
const CATS=[
 {key:'espresso',label:'Espresso machines',short:'machines',cats:['espresso'],groups:[
   [['semi','Semi-automatic',g=>g.effort!==3&&g.kind!=='super'],['super','Super-automatic',g=>g.kind==='super'],['lever','Manual and lever',g=>g.effort===3]],
   [['easy','Easy to use',g=>g.kind==='super'||g.effort===1||!!g.builtIn]],
   [['milk','Steam wand',g=>!!g.milk]],[['grinder','Built-in grinder',g=>!!g.builtIn]],[['compact','Compact',g=>g.w===1]]]},
 {key:'grinders',label:'Grinders',short:'grinders',cats:['grinder'],groups:[
   [['hand','Hand',g=>g.kind==='hand'],['electric','Electric',g=>g.kind!=='hand']],
   [['espresso','Espresso',g=>(g.does||[]).includes('espresso')],['filter','Filter',g=>(g.does||[]).includes('filter')]],
   [['single','Single dose',g=>g.kind!=='hand'&&g.kind!=='hopper'],['hopper','Hopper',g=>g.kind==='hopper']]]},
 {key:'brewers',label:'Coffee makers',short:'coffee makers',cats:['brewer'],groups:[
   [['pourover','Pour-over',g=>['cone','chemex'].includes(g.kind)],['immersion','Immersion',g=>['steep','aeropress'].includes(g.kind)],
    ['press','French press',g=>g.kind==='press'],['moka','Moka pot',g=>g.kind==='moka'],['machine','Drip machine',g=>!['cone','chemex','steep','aeropress','press','moka','cold'].includes(g.kind)],['cold','Cold brew',g=>g.kind==='cold']]]},
 {key:'kettles',label:'Kettles and scales',short:'kettles and scales',cats:['kettle','scale'],groups:[
   [['kettle','Kettles',g=>g.cat==='kettle'],['scale','Scales',g=>g.cat==='scale']],
   [['electric','Electric',g=>g.cat==='kettle'&&!!g.electric],['stove','Stovetop',g=>g.cat==='kettle'&&!g.electric]],
   [['timer','With timer',g=>g.cat==='scale'&&!!g.timer]]]},
 {key:'beans',label:'Beans',short:'beans',cats:['bean'],groups:[
   [['light','Light roast',g=>g.roast==='light'],['medium','Medium roast',g=>g.roast==='medium'],['dark','Dark roast',g=>g.roast==='dark']],
   [['forEsp','For espresso',g=>g.for!=='filter'],['forFil','For filter',g=>g.for!=='espresso']],
   [['fruity','Fruity',g=>g.flavor==='fruity'],['choc','Chocolatey',g=>g.flavor==='choc'],['sweet','Sweet',g=>g.flavor==='sweet']]]}
];
const catOf=it=>CATS.find(c=>c.cats.includes(it.cat))||CATS[0];

/* ---------- state ---------- */
let S={view:'home',filters:{},setup:[],cur:'USD',side:true,chat:{}};
try{const old=JSON.parse(localStorage.getItem('bf2')||'null');if(old){S.setup=old.setup||[];S.cur=old.cur||'USD'}}catch(e){}
try{const s=JSON.parse(localStorage.getItem('cc3')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('cc3',JSON.stringify(S))}catch(e){}};
const byId=id=>GEAR.find(g=>g.id===id);
const phoneMQ=matchMedia('(max-width:760px)');
let LOG=[];   // free-text exchanges with the assistant, this visit only

/* ---------- product renders (procedural SVG, transparent background) ---------- */
let uid=0;
function shade(hex,p){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return `rgb(${r},${g},${b})`}
function art(it){
  const u='g'+(uid++), c=it.col||'#8A8D90', a=it.acc||'#333333';
  const isGlass=c==='glass'||c==='tan';
  const base=c==='chrome'?'#C9CCCF':isGlass?'#BFC9CE':c;
  const defs=`<defs>
   <linearGradient id="${u}b" x1="0" x2="1"><stop offset="0" stop-color="${shade(base,.28)}"/><stop offset=".42" stop-color="${base}"/><stop offset="1" stop-color="${shade(base,-.38)}"/></linearGradient>

function parseQuery(text){
  let t=' '+text.toLowerCase().replace(/[’']/g,"'")+' ';
  const q={chips:[],cats:new Set(),rules:[],max:null,words:[]};
  let m=t.match(/(?:under|below|less than|max|up to|<)\s*\$?\s*(\d[\d,]*)/)||t.match(/\$\s*(\d[\d,]*)/);
  if(m){q.max=Number(m[1].replace(/,/g,''));q.chips.push('Under '+money(nice(q.max)));t=t.replace(m[0],' ')}
  if(/\b(cheap|budget|affordable|inexpensive)\b/.test(t)){q.cheap=true;q.chips.push('Budget');t=t.replace(/\b(cheap|budget|affordable|inexpensive)\b/g,' ')}
  for(const [re,label,fn] of KW)if(re.test(t)){q.rules.push(fn);q.chips.push(label);t=t.replace(new RegExp(re.source,'g'),' ')}
  for(const [re,label,cat] of CAT_WORDS)if(re.test(t)){q.cats.add(cat);q.chips.push(label);t=t.replace(new RegExp(re.source,'g'),' ')}
  // anything left: brand, product, roaster or origin names, kept only if something in the catalog has them
  q.words=t.split(/[^a-z0-9\-]+/).filter(w=>w.length>2&&!STOP.has(w)&&GEAR.some(g=>hay(g).includes(w)));
  q.words.forEach(w=>q.chips.push('“'+w+'”'));

}

function suggest(a){
  const cap={lo:300,mid:800,hi:1e9,any:1e9}[a.budget]||1e9;
  const need=[];
  const pool=(cat,f)=>GEAR.filter(g=>g.cat===cat&&f(g)).sort(byPop).slice(0,12);
  if(wantsEsp(a)){const e=a.easy?g=>g.effort===1:CATS[0].groups[0].find(o=>o[0]===a.hands)?.[2]||(g=>true);
    need.push(pool('espresso',g=>e(g)&&(!(a.drinks||[]).includes('milk')||g.milk)))}
  if(wantsFil(a)){const b=CATS[2].groups[0].find(o=>o[0]===a.brew);need.push(pool('brewer',b?b[2]:g=>true))}
  if(a.grinder==='no'){const f=grinderFilters(a), c=CATS[1];need.push(pool('grinder',g=>c.groups.every(gr=>{const on=gr.filter(o=>f.includes(o[0]));return !on.length||on.some(o=>o[2](g))})))}

  need.push(pool('bean',g=>wantsEsp(a)?g.for!=='filter':g.for!=='espresso'));

  const total=()=>lists.reduce((s,l,i)=>s+(l[pick[i]].price||0),0);
  for(let n=0;n<80&&total()>cap;n++){
    // swap the priciest pick for a cheaper option in the same list
    let best=-1,gain=0;

function setupReply(){
  const its=S.setup.map(byId).filter(Boolean);
  return its.length?`You have ${its.length} thing${its.length>1?'s':''} saved:${kitHtml(its)}<p class="past" style="margin-top:8px">Prices in ${esc(cur())}.</p>`
    :'Nothing saved yet. Finish the questions above, or open any product and choose “Add to my setup”.';
}
function reply(text){
  const q=text.trim();if(!q)return;LOG.push({me:q});
  const low=q.toLowerCase(), code=(low.match(/\b(usd|cad|eur|gbp|aud)\b/)||[])[1];
  if(code&&FX[code.toUpperCase()]){S.cur=code.toUpperCase();save();renderMain(false);LOG.push({html:`Prices are now in ${S.cur}.`})}
  else if(/currenc|price in|prices in/.test(low)){const cs=Object.keys(CURS).filter(c=>FX[c]);LOG.push({html:`Prices are in ${esc(cur())}. Pick another currency:<div class="row-acts" style="margin-top:8px">${cs.map(c=>`<button class="soft${c===cur()?' dark':''}" data-cur="${c}">${c}</button>`).join('')}</div>`})}
  else if(/setup|saved|my kit/.test(low))LOG.push({html:setupReply()});
  else{
    const words=low.split(/\s+/).filter(w=>w.length>2);
    const hits=GEAR.filter(it=>{const t=[it.name,it.brand,it.roaster,it.origin,sub(it)].join(' ').toLowerCase();return t.includes(low)||words.length&&words.every(w=>t.includes(w))}).sort(byPop).slice(0,4);
    const pq=parseQuery(q);QUERY=pq;drawAll(true);
    const n=pq?GEAR.filter(g=>matchQuery(pq,g)).length:0;
    LOG.push({html:pq?`Looking for<div>${pq.chips.map(c=>`<span class="kw">${esc(c)}</span>`).join('')}</div><p class="past" style="margin-top:8px">${n?`${fmtN(n)} ${n===1?'product fits':'products fit'}. They’re shown in the groups on the right.`:'Nothing in the catalog fits all of that yet. Remove a word to see more.'}</p>`
      :hits.length?`Here’s what I found in the catalog for “${esc(q)}”:${kitHtml(hits,false)}`:`I couldn’t match “${esc(q)}” to anything yet. Try a product type, a brand, or a budget like “under $300”.`});
  }
  renderSide();
}

function specs(it){
  const r=({bean:()=>[['Roaster',it.roaster||'—'],['Origin',it.origin||'—'],['Process',it.process||'—'],['Variety',it.variety||'—'],['Roast',it.degree||it.roast||'—'],['Tasting notes',(it.notes||[]).join(', ')||'—'],['Bag',it.size_g?`${it.size_g} g · ${money(it.price/it.size_g*100)} per 100 g`:'—']],
    grinder:()=>[['Type',it.kind==='hand'?'Hand grinder':it.kind==='hopper'?'Electric, hopper':'Electric, single dose'],['Burrs',it.burr],['Grinds for',(it.does||[]).join(' and ')]],
    espresso:()=>[['Heating',it.heat],['Steam wand',it.milk?(it.auto?'Yes, automatic':'Yes'):'No'],['Grinder',it.builtIn?'Built in':'Buy separately'],['Footprint',['','Compact','Medium','Large'][it.w]]],
    brewer:()=>[['Method',it.method],['Makes',`Up to ${it.cap} cup${it.cap>1?'s':''}`],['You also need',it.needs]],
    kettle:()=>[['Heat',it.electric?'Electric base':'Stovetop'],['Temperature control',it.temp?'Yes':'No'],['Spout','Gooseneck']],
    scale:()=>[['Features',it.spec],['Best for',{both:'Espresso and pour-over',espresso:'Espresso',pourover:'Pour-over'}[it.use]]]})[it.cat]();
  return `<dl class="specs">${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buyLinks(it,q){
  const own=(it.links||[]).map(l=>({label:l.label,url:safeUrl(l.url)})).filter(l=>l.url&&l.label).slice(0,3);
  if(own.length)return own.map((l,i)=>`<a class="${i?'sec':'pri'}" href="${esc(l.url)}" target="_blank" rel="noopener sponsored">${esc(l.label)} <small>↗</small></a>`).join('');
  return `<a class="pri" href="https://www.amazon.com/s?k=${q}&tag=${AFFILIATE.amazonTag}" target="_blank" rel="noopener sponsored">Buy on Amazon <small>↗</small></a>
      <a class="sec" href="https://www.google.com/search?tbm=shop&q=${q}" target="_blank" rel="noopener">Compare other shops <small>↗</small></a>`;
}

function renderCur(){}

function mergeCatalog(){
  const live=x=>x.status!=='discontinued';
  GEAR=[...RAW.gear.filter(live),...RAW.beans.filter(live).map(b=>({...b,cat:'bean'}))];
}
async function boot(){
  const cfg=window.CATALOG_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){LOAD='offline';renderAll(true);return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  await loadCatalog(true);
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;setTimeout(checkAdmin,0)});
  const {data}=await SB.auth.getSession();SESSION=data.session;checkAdmin();
  if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
  if(location.hash==='#owner'&&!SESSION)openSignIn();
}
/* Loading, fastest first: gear (small) draws the page right away, beans follow.
   Beans come without their long fields (description, notes, links); a product popup fetches those.
   The last catalog is kept on this device so a return visit draws immediately, then refreshes. */
const BEAN_FIELDS='id,name:doc->>name,roaster:doc->>roaster,origin:doc->>origin,roast:doc->>roast,for:doc->>for,flavor:doc->>flavor,degree:doc->>degree,price:doc->price,size_g:doc->size_g,img:doc->>img,pop:doc->pop,status:doc->>status,source:doc->>source';
const CACHE_KEY='cc-catalog-1';
let BEANS_LOADING=true;
const asItem=r=>r.doc?{id:r.id,...r.doc}:{...r};
async function rows(table,cols,count){
  // pages of 1,000 fetched side by side
  if(!count){const out=[];for(let f=0;;f+=1000){const r=await SB.from(table).select(cols).order('id').range(f,f+999);if(r.error)return r;out.push(...r.data);if(r.data.length<1000)return {data:out}}}
  const pages=await Promise.all(Array.from({length:Math.ceil(count/1000)},(_,i)=>SB.from(table).select(cols).order('id').range(i*1000,i*1000+999)));
  const bad=pages.find(r=>r.error);return bad||{data:pages.flatMap(r=>r.data)};
}
async function countOf(table){try{const r=await SB.from(table).select('id',{count:'exact',head:true});return typeof r.count==='number'?r.count:0}catch(e){return 0}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.gear&&c.beans){RAW.gear=c.gear;RAW.beans=c.beans;if(c.fx)FX=c.fx;mergeCatalog();LOAD='stale';BEANS_LOADING=false;return true}}catch(e){}return false}
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),gear:RAW.gear,beans:RAW.beans,fx:FX}))}catch(e){}}
function redraw(first){if(first)renderAll(true);else{renderMain(false);renderSide()}}
async function loadCatalog(first){
  const cached=first&&readCache();
  if(cached)redraw(true);
  try{
    const beansP=countOf('beans').then(n=>rows('beans',BEAN_FIELDS,n));   // starts now, alongside gear
    const [g,m]=await Promise.all([rows('gear','id,doc'),SB.from('meta').select('id,doc').eq('id','fx').maybeSingle()]);
    if(g.error)throw g.error;
    RAW.gear=g.data.map(asItem);
    if(m.data&&m.data.doc&&m.data.doc.rates)FX={USD:1,...m.data.doc.rates};
    mergeCatalog();LOAD='ready';
    if(!cached)redraw(first);
    const b=await beansP;
    if(b.error)throw b.error;
    const full=new Map(RAW.beans.filter(x=>x._full).map(x=>[x.id,x]));
    RAW.beans=b.data.map(asItem).map(x=>full.get(x.id)||x);
    BEANS_LOADING=false;mergeCatalog();writeCache();
  }catch(e){LOAD=GEAR.length?'stale':'offline';BEANS_LOADING=false}
  redraw(first&&!cached&&LOAD==='offline');
}
async function fullBean(id){
  const it=byId(id);if(!it||it.cat!=='bean'||it._full||!SB)return;
  try{const {data}=await SB.from('beans').select('id,doc').eq('id',id).maybeSingle();
    if(data&&data.id===id){const x={...asItem(data),_full:true};const i=RAW.beans.findIndex(b=>b.id===id);if(i>=0)RAW.beans[i]=x;mergeCatalog()}}catch(e){}
}
async function checkAdmin(){

  if(isEditor)await loadPending();else{PENDING=[];updateReviewBtn()}

/* ---------- review queue (editors only) ---------- */
const KIND={add:'New',update:'Update',discontinue:'Discontinue'};
function fmtVal(k,v){if(k==='price')return money(Number(v)||0);if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.label||x.title||''):x).join(', ');if(v&&typeof v==='object')return JSON.stringify(v);return String(v)}
function propHtml(p){
  let body='';
  if(p.kind==='update'&&p.changes){
    body=`<div class="diff">${Object.keys(p.changes).map(k=>`<span>${esc(k)}</span><span>${p.previous&&p.previous[k]!==undefined?`<s>${esc(fmtVal(k,p.previous[k]))}</s> → `:''}${esc(fmtVal(k,p.changes[k]))}</span>`).join('')}</div>`;
  }else if(p.kind==='add'&&p.data){
    const d=p.data;body=`<div class="diff"><span>price</span><span>${esc(money(Number(d.price)||0))}</span>${['brand','roaster','origin','burr','heat','roast'].filter(k=>d[k]).map(k=>`<span>${k}</span><span>${esc(d[k])}</span>`).join('')}</div>`;
  }
  const src=(p.sources||[]).map(x=>({t:x.title||x.url,u:safeUrl(x.url)})).filter(x=>x.u).slice(0,4);
  return `<div class="prop"><div class="top"><span class="what">${esc(p.item_name||p.doc_id)}</span><span class="kind">${KIND[p.kind]||esc(p.kind)}${(()=>{const c=p.collection==='beans'?'bean':((p.data&&p.data.cat)||(RAW.gear.find(g=>g.id===p.doc_id)||{}).cat||'');return c?' · '+esc(c==='espresso'?'machine':c):''})()}</span></div>
    ${p.reason?`<div class="why">${esc(p.reason)}</div>`:''}${body}
    ${src.length?`<div class="src">${src.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t).slice(0,48)} ↗</a>`).join('')}</div>`:''}
    <div class="acts"><button class="ok" data-ok="${esc(p.id)}">Approve</button><button class="no" data-no="${esc(p.id)}">Reject</button></div></div>`;
}
async function decide(id,ok){
  const {error}=await SB.rpc(ok?'apply_proposal':'reject_proposal',{pid:id});
  if(error){toast('Couldn’t save that. Try again.');return false}
  toast(ok?'Approved':'Rejected');
  PENDING=PENDING.filter(p=>p.id!==id);updateReviewBtn();
  if(layer.querySelector('#reviewList'))openReview();
  return true;
}
function openReview(){
  openModal(`<h2 class="mt">Review queue</h2><p class="ms">${PENDING.length?`${PENDING.length} change${PENDING.length>1?'s':''} from the research agent`:'All caught up'}</p>
    ${PENDING.length>1?`<div class="allbar"><span class="ms" style="margin:0">Approve applies the change to the live site.</span><button class="pill" id="okAll">Approve all</button></div>`:''}
    <div id="reviewList">${PENDING.map(propHtml).join('')}</div>`);
  const list=document.getElementById('reviewList');
  list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;b.disabled=true;const ok=!!b.dataset.ok;if(await decide(b.dataset.ok||b.dataset.no,ok)&&ok)loadCatalog(false)});
  const all=document.getElementById('okAll');
  if(all)all.onclick=async()=>{all.disabled=true;for(const p of [...PENDING])await decide(p.id,true);loadCatalog(false)};
}
document.getElementById('reviewBtn').onclick=openReview;

function renderAll(){renderMain(false);renderSide();renderSign()}
